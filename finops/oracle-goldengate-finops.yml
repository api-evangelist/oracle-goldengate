specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Oracle GoldenGate
providerId: oracle-goldengate
publisherName: Oracle GoldenGate
serviceCategory: API
created: '2026-05-04'
modified: '2026-05-04'
tags:
  - CDC
  - Data Integration
  - Data Synchronization
  - Database
  - Enterprise
  - Real-Time Replication
  - FinOps
  - Cost Management
  - FOCUS
description: FinOps framework definition for the Oracle GoldenGate API surface. Provides a FOCUS-aligned
  mapping for cost allocation, usage measurement, and unit-economics reporting across the provider's APIs.
principles:
  - name: Visibility
    description: Make API consumption costs visible to engineering, product, and finance teams in near
      real-time.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment, application, and
      feature so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate request patterns, caching, batching, and tier selection to reduce
      cost per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Oracle GoldenGate
  ServiceCategory: Developer Tools / API
  ProviderName: Oracle GoldenGate
  PublisherName: Oracle GoldenGate
  InvoiceIssuerName: Oracle GoldenGate
  PricingCategory: Usage-Based
  PricingUnit: request
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: api_requests
    description: Count of billable API requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
      - region
      - consumer
  - name: data_egress
    description: Bytes returned over the network in API responses
    unit: GB
    aggregation: sum
    dimensions:
      - api
      - region
      - consumer
  - name: compute_seconds
    description: Server-side compute consumed by the request, where applicable
    unit: second
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
apis:
  - name: Oracle GoldenGate REST API
    baseURL: https://<goldengate-host>:<port>/services/v2
    tags:
      - CDC
      - Data Replication
      - ETL
      - Microservices
      - Real-Time Data Integration
    serviceName: Oracle GoldenGate REST API
    serviceCategory: API
  - name: Oracle GoldenGate for Big Data REST API
    baseURL: https://<goldengate-host>:<port>/services/v2
    tags:
      - Big Data
      - Hadoop
      - Kafka
      - NoSQL
      - Streaming
    serviceName: Oracle GoldenGate for Big Data REST API
    serviceCategory: API
  - name: Oracle GoldenGate Veridata REST API
    baseURL: https://<veridata-host>:<port>/veridata/v1
    tags:
      - Comparison
      - Data Quality
      - Data Validation
      - Data Verification
    serviceName: Oracle GoldenGate Veridata REST API
    serviceCategory: API
  - name: Oracle GoldenGate Cloud Service API
    baseURL: https://goldengate.{region}.oci.oraclecloud.com
    tags:
      - Cloud
      - Cloud Integration
      - Database Migration
      - OCI
    serviceName: Oracle GoldenGate Cloud Service API
    serviceCategory: API
  - name: Oracle GoldenGate Stream Analytics REST API
    baseURL: https://<ggsa-host>:<port>/osa
    tags:
      - Dashboards
      - Event Processing
      - Real-Time Analytics
      - Spark
      - Stream Analytics
    serviceName: Oracle GoldenGate Stream Analytics REST API
    serviceCategory: API
  - name: Oracle GoldenGate Data Streams REST API
    baseURL: https://<goldengate-host>:<port>/services/v2
    tags:
      - Data Distribution
      - Data Streams
      - Real-Time
      - Streaming
    serviceName: Oracle GoldenGate Data Streams REST API
    serviceCategory: API
unitEconomics:
  - name: Cost per 1K Requests
    metric: billed_cost / (api_requests / 1000)
    target: TBD
  - name: Cost per Active Consumer
    metric: billed_cost / active_consumers
    target: TBD
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
