description: >-
  FOCUS-aligned FinOps view for Oracle GoldenGate: OCI managed service
  billing per OCPU-hour by edition, plus separate OCI block storage and
  egress meters for trail files and replicated data; on-premises deployments
  are billed against the contractual Oracle Technology license. FinOps
  observation focuses on edition-OCPU utilization and replication egress.
sources:
  - https://www.oracle.com/integration/goldengate/
  - https://docs.oracle.com/en/cloud/paas/goldengate-service/
  - https://www.oracle.com/cloud/price-list/
notes: >-
  No public per-API meter exists. Track OCPU-hour consumption per GoldenGate
  edition through OCI Cost Analysis, plus block storage and egress for trail
  files and outbound replication.
billingModel:
  pricingCategory: Pay-As-You-Go (OCI) + BYOL (On-Premises)
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Adjustment
    - Credit
focusColumns:
  ServiceName: Oracle GoldenGate
  ServiceCategory: Data Integration
  ProviderName: Oracle
  PublisherName: Oracle America, Inc.
  InvoiceIssuerName: Oracle America, Inc.
  BillingCurrency: USD
  PricingCategory: Pay-As-You-Go
  ChargeCategory: Usage
meters:
  - name: goldengate_ocpu_hours
    description: OCPU-hours consumed by OCI GoldenGate deployments
    unit: ocpu-hour
    aggregation: sum
    dimensions:
      - edition
      - region
      - deployment
      - tag
  - name: goldengate_trail_storage_gb_month
    description: Block storage attached to GoldenGate deployments for trail files
    unit: GB-month
    aggregation: sum
    dimensions:
      - region
      - deployment
  - name: goldengate_egress_gb
    description: Outbound data transfer from GoldenGate deployments to remote targets
    unit: GB
    aggregation: sum
    dimensions:
      - region
      - target_type
  - name: goldengate_on_prem_license
    description: Contractual Oracle Technology license for on-premises GoldenGate
    unit: license
    aggregation: max
    dimensions:
      - license_type
principles:
  - name: Visibility
    description: >-
      Use OCI Cost Analysis with cost-tracking tags applied to each
      GoldenGate deployment, attached block storage, and the deployment's
      VCN to see OCPU and egress consumption by edition and region.
  - name: Allocation
    description: >-
      Apply cost-tracking tags (e.g. team, source_db, target_system) to each
      deployment so replication cost can be attributed to the consuming data
      pipeline.
  - name: Optimization
    description: >-
      Right-size deployment OCPU to match peak replication lag tolerance,
      consolidate low-volume sources onto shared deployments, and prefer
      cross-region replication only where data-residency requirements
      mandate it (egress is metered).
  - name: Accountability
    description: >-
      Assign a data-platform owner to each GoldenGate deployment; review OCI
      consumption monthly and on-premises support renewals annually.
