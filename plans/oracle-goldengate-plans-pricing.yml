created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - CDC
  - Data Integration
  - Data Synchronization
  - Oracle Cloud
  - Real-Time Replication
description: >-
  Oracle GoldenGate is delivered in two commercial shapes. As an OCI managed
  service ("OCI GoldenGate") it is billed per OCPU-hour by GoldenGate edition
  (GoldenGate, GoldenGate for Big Data, Veridata, Stream Analytics, Data
  Streams), with separate egress and storage charges flowing through OCI.
  As an on-premises product it is licensed per processor or per named-user-plus
  on the Oracle Technology Global Price List. There is no free or per-API
  public tier; the management REST API is included with any active edition.
  Engage Oracle Sales for the current per-OCPU and per-processor rate.
sources:
  - https://www.oracle.com/integration/goldengate/
  - https://docs.oracle.com/en/cloud/paas/goldengate-service/
  - https://www.oracle.com/cloud/price-list/
notes: >-
  Oracle blocks programmatic fetches of www.oracle.com pricing pages (HTTP 403).
  Plan structure preserved as one OCI per-OCPU plan plus an on-premises BYOL
  plan and an enterprise tier; replace with verified Oracle Cloud Price List
  values when available.
plans:
  - id: oracle-goldengate-oci-service
    name: OCI GoldenGate (Managed Service)
    type: usage-based
    description: >-
      Fully managed Oracle GoldenGate on OCI, billed per OCPU-hour against the
      selected GoldenGate edition. Includes the GoldenGate management REST
      API and underlying lifecycle automation.
    entries:
      - label: GoldenGate OCPU
        name: goldengate_ocpu
        type: metered
        metric: ocpu-hour
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: see https://www.oracle.com/cloud/price-list/
        userMultiplied: false
      - label: GoldenGate for Big Data OCPU
        name: goldengate_bigdata_ocpu
        type: metered
        metric: ocpu-hour
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: see https://www.oracle.com/cloud/price-list/
        userMultiplied: false
      - label: Veridata OCPU
