        userMultiplied: false
    elements:
      - name: Oracle GoldenGate REST API
      - name: Oracle GoldenGate for Big Data REST API
      - name: Oracle GoldenGate Veridata REST API
      - name: Oracle GoldenGate Cloud Service API
      - name: Oracle GoldenGate Stream Analytics REST API
      - name: Oracle GoldenGate Data Streams REST API
  - id: oracle-goldengate-on-premises
    name: On-Premises (Per-Processor / NUP)
    type: subscription
    description: >-
      On-premises Oracle GoldenGate, licensed per processor or per named-user-plus
      on the Oracle Technology Global Price List, with separately purchased
      annual support and update licenses.
    entries:
