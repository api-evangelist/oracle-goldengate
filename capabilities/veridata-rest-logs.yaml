naftiko: 1.0.0-alpha2
info:
  label: Oracle GoldenGate Veridata REST API — Logs
  description: 'Oracle GoldenGate Veridata REST API — Logs. 1 operations. Lead operation: Oracle Goldengate Retrieve Server
    Logs. Self-contained Naftiko capability covering one Oracle Goldengate business surface.'
  tags:
  - Oracle Goldengate
  - Logs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ORACLE_GOLDENGATE_API_KEY: ORACLE_GOLDENGATE_API_KEY
capability:
  consumes:
  - type: http
    namespace: veridata-rest-logs
    baseUri: https://{veridata-host}:{port}/veridata/v1
    description: Oracle GoldenGate Veridata REST API — Logs business capability. Self-contained, no shared references.
    resources:
    - name: services-logs-server
      path: /services/logs/server
      operations:
      - name: getserverlogs
        method: GET
        description: Oracle Goldengate Retrieve Server Logs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: logType
          in: query
          type: string
        - name: logLevel
          in: query
          type: string
        - name: lastLines
          in: query
          type: integer
    authentication:
      type: basic
      username: '{{env.ORACLE_GOLDENGATE_USER}}'
      password: '{{env.ORACLE_GOLDENGATE_PASS}}'
  exposes:
  - type: rest
    namespace: veridata-rest-logs-rest
    port: 8080
    description: REST adapter for Oracle GoldenGate Veridata REST API — Logs. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/services/logs/server
      name: services-logs-server
      description: REST surface for services-logs-server.
      operations:
      - method: GET
        name: getserverlogs
        description: Oracle Goldengate Retrieve Server Logs
        call: veridata-rest-logs.getserverlogs
        with:
          logType: rest.logType
          logLevel: rest.logLevel
          lastLines: rest.lastLines
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: veridata-rest-logs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Oracle GoldenGate Veridata REST API — Logs. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: oracle-goldengate-retrieve-server-logs
      description: Oracle Goldengate Retrieve Server Logs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: veridata-rest-logs.getserverlogs
      with:
        logType: tools.logType
        logLevel: tools.logLevel
        lastLines: tools.lastLines
      outputParameters:
      - type: object
        mapping: $.
