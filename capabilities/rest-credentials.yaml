naftiko: 1.0.0-alpha2
info:
  label: Oracle GoldenGate REST API — Credentials
  description: 'Oracle GoldenGate REST API — Credentials. 7 operations. Lead operation: Oracle Goldengate List Credential
    Domains. Self-contained Naftiko capability covering one Oracle Goldengate business surface.'
  tags:
  - Oracle Goldengate
  - Credentials
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ORACLE_GOLDENGATE_API_KEY: ORACLE_GOLDENGATE_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-credentials
    baseUri: https://{goldengate-host}:{port}
    description: Oracle GoldenGate REST API — Credentials business capability. Self-contained, no shared references.
    resources:
    - name: services-v2-credentials
      path: /services/v2/credentials
      operations:
      - name: listcredentialdomains
        method: GET
        description: Oracle Goldengate List Credential Domains
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: services-v2-credentials-domain
      path: /services/v2/credentials/{domain}
      operations:
      - name: listdomainaliases
        method: GET
        description: Oracle Goldengate List Aliases in a Credential Domain
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: services-v2-credentials-domain-alias
      path: /services/v2/credentials/{domain}/{alias}
      operations:
      - name: getcredentialalias
        method: GET
        description: Oracle Goldengate Retrieve a Credential Alias
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcredentialalias
        method: POST
        description: Oracle Goldengate Create a Credential Alias
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: replacecredentialalias
        method: PUT
        description: Oracle Goldengate Replace a Credential Alias
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletecredentialalias
        method: DELETE
        description: Oracle Goldengate Delete a Credential Alias
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: services-v2-credentials-domain-alias-valid
      path: /services/v2/credentials/{domain}/{alias}/valid
      operations:
      - name: validatecredentialalias
        method: GET
        description: Oracle Goldengate Validate a Credential Alias
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.ORACLE_GOLDENGATE_USER}}'
      password: '{{env.ORACLE_GOLDENGATE_PASS}}'
  exposes:
  - type: rest
    namespace: rest-credentials-rest
    port: 8080
    description: REST adapter for Oracle GoldenGate REST API — Credentials. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/services/v2/credentials
      name: services-v2-credentials
      description: REST surface for services-v2-credentials.
      operations:
      - method: GET
        name: listcredentialdomains
        description: Oracle Goldengate List Credential Domains
        call: rest-credentials.listcredentialdomains
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/services/v2/credentials/{domain}
      name: services-v2-credentials-domain
      description: REST surface for services-v2-credentials-domain.
      operations:
      - method: GET
        name: listdomainaliases
        description: Oracle Goldengate List Aliases in a Credential Domain
        call: rest-credentials.listdomainaliases
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/services/v2/credentials/{domain}/{alias}
      name: services-v2-credentials-domain-alias
      description: REST surface for services-v2-credentials-domain-alias.
      operations:
      - method: GET
        name: getcredentialalias
        description: Oracle Goldengate Retrieve a Credential Alias
        call: rest-credentials.getcredentialalias
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createcredentialalias
        description: Oracle Goldengate Create a Credential Alias
        call: rest-credentials.createcredentialalias
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: replacecredentialalias
        description: Oracle Goldengate Replace a Credential Alias
        call: rest-credentials.replacecredentialalias
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletecredentialalias
        description: Oracle Goldengate Delete a Credential Alias
        call: rest-credentials.deletecredentialalias
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/services/v2/credentials/{domain}/{alias}/valid
      name: services-v2-credentials-domain-alias-valid
      description: REST surface for services-v2-credentials-domain-alias-valid.
      operations:
      - method: GET
        name: validatecredentialalias
        description: Oracle Goldengate Validate a Credential Alias
        call: rest-credentials.validatecredentialalias
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-credentials-mcp
    port: 9090
    transport: http
    description: MCP adapter for Oracle GoldenGate REST API — Credentials. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: oracle-goldengate-list-credential-domains
      description: Oracle Goldengate List Credential Domains
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-credentials.listcredentialdomains
      outputParameters:
      - type: object
        mapping: $.
    - name: oracle-goldengate-list-aliases-credential
      description: Oracle Goldengate List Aliases in a Credential Domain
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-credentials.listdomainaliases
      outputParameters:
      - type: object
        mapping: $.
    - name: oracle-goldengate-retrieve-credential-alias
      description: Oracle Goldengate Retrieve a Credential Alias
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-credentials.getcredentialalias
      outputParameters:
      - type: object
        mapping: $.
    - name: oracle-goldengate-create-credential-alias
      description: Oracle Goldengate Create a Credential Alias
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-credentials.createcredentialalias
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: oracle-goldengate-replace-credential-alias
      description: Oracle Goldengate Replace a Credential Alias
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: rest-credentials.replacecredentialalias
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: oracle-goldengate-delete-credential-alias
      description: Oracle Goldengate Delete a Credential Alias
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: rest-credentials.deletecredentialalias
      outputParameters:
      - type: object
        mapping: $.
    - name: oracle-goldengate-validate-credential-alias
      description: Oracle Goldengate Validate a Credential Alias
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-credentials.validatecredentialalias
      outputParameters:
      - type: object
        mapping: $.
