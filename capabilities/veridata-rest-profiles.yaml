naftiko: 1.0.0-alpha2
info:
  label: Oracle GoldenGate Veridata REST API — Profiles
  description: 'Oracle GoldenGate Veridata REST API — Profiles. 6 operations. Lead operation: Oracle Goldengate Retrieve All
    Profiles. Self-contained Naftiko capability covering one Oracle Goldengate business surface.'
  tags:
  - Oracle Goldengate
  - Profiles
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ORACLE_GOLDENGATE_API_KEY: ORACLE_GOLDENGATE_API_KEY
capability:
  consumes:
  - type: http
    namespace: veridata-rest-profiles
    baseUri: https://{veridata-host}:{port}/veridata/v1
    description: Oracle GoldenGate Veridata REST API — Profiles business capability. Self-contained, no shared references.
    resources:
    - name: services-configuration-profiles
      path: /services/configuration/profiles
      operations:
      - name: listprofiles
        method: GET
        description: Oracle Goldengate Retrieve All Profiles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createprofile
        method: POST
        description: Oracle Goldengate Create a Profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: services-configuration-profiles-Id
      path: /services/configuration/profiles/{Id}
      operations:
      - name: getprofile
        method: GET
        description: Oracle Goldengate Retrieve a Profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateprofile
        method: PATCH
        description: Oracle Goldengate Update a Profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteprofile
        method: DELETE
        description: Oracle Goldengate Delete a Profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: services-configuration-profiles-Id-reset
      path: /services/configuration/profiles/{Id}/reset
      operations:
      - name: resetprofile
        method: PUT
        description: Oracle Goldengate Reset a Profile to Defaults
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.ORACLE_GOLDENGATE_USER}}'
      password: '{{env.ORACLE_GOLDENGATE_PASS}}'
  exposes:
  - type: rest
    namespace: veridata-rest-profiles-rest
    port: 8080
    description: REST adapter for Oracle GoldenGate Veridata REST API — Profiles. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/services/configuration/profiles
      name: services-configuration-profiles
      description: REST surface for services-configuration-profiles.
      operations:
      - method: GET
        name: listprofiles
        description: Oracle Goldengate Retrieve All Profiles
        call: veridata-rest-profiles.listprofiles
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createprofile
        description: Oracle Goldengate Create a Profile
        call: veridata-rest-profiles.createprofile
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/services/configuration/profiles/{id}
      name: services-configuration-profiles-id
      description: REST surface for services-configuration-profiles-Id.
      operations:
      - method: GET
        name: getprofile
        description: Oracle Goldengate Retrieve a Profile
        call: veridata-rest-profiles.getprofile
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateprofile
        description: Oracle Goldengate Update a Profile
        call: veridata-rest-profiles.updateprofile
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteprofile
        description: Oracle Goldengate Delete a Profile
        call: veridata-rest-profiles.deleteprofile
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/services/configuration/profiles/{id}/reset
      name: services-configuration-profiles-id-reset
      description: REST surface for services-configuration-profiles-Id-reset.
      operations:
      - method: PUT
        name: resetprofile
        description: Oracle Goldengate Reset a Profile to Defaults
        call: veridata-rest-profiles.resetprofile
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: veridata-rest-profiles-mcp
    port: 9090
    transport: http
    description: MCP adapter for Oracle GoldenGate Veridata REST API — Profiles. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: oracle-goldengate-retrieve-all-profiles
      description: Oracle Goldengate Retrieve All Profiles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: veridata-rest-profiles.listprofiles
      outputParameters:
      - type: object
        mapping: $.
    - name: oracle-goldengate-create-profile
      description: Oracle Goldengate Create a Profile
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: veridata-rest-profiles.createprofile
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: oracle-goldengate-retrieve-profile
      description: Oracle Goldengate Retrieve a Profile
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: veridata-rest-profiles.getprofile
      outputParameters:
      - type: object
        mapping: $.
    - name: oracle-goldengate-update-profile
      description: Oracle Goldengate Update a Profile
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: veridata-rest-profiles.updateprofile
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: oracle-goldengate-delete-profile
      description: Oracle Goldengate Delete a Profile
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: veridata-rest-profiles.deleteprofile
      outputParameters:
      - type: object
        mapping: $.
    - name: oracle-goldengate-reset-profile-defaults
      description: Oracle Goldengate Reset a Profile to Defaults
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: veridata-rest-profiles.resetprofile
      outputParameters:
      - type: object
        mapping: $.
