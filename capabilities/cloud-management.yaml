naftiko: 1.0.0-alpha2
info:
  label: Oracle GoldenGate Cloud Management
  description: Unified workflow for managing Oracle GoldenGate cloud deployments in OCI. Combines the OCI Cloud Service API
    with Stream Analytics for cloud platform administrators managing deployment lifecycle, connections, pipelines, backups,
    and stream analytics in Oracle Cloud.
  tags:
  - Oracle GoldenGate
  - OCI
  - Cloud Management
  - Platform Administration
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    OCI_API_KEY: OCI_API_KEY
    GGSA_USERNAME: GGSA_USERNAME
    GGSA_PASSWORD: GGSA_PASSWORD
capability:
  consumes:
  - type: http
    namespace: goldengate-cloud
    baseUri: https://goldengate.{region}.oci.oraclecloud.com
    description: OCI GoldenGate Cloud Service API
    authentication:
      type: bearer
      token: '{{OCI_API_KEY}}'
    resources:
    - name: deployments
      path: /20200407/deployments
      description: GoldenGate deployment management in OCI
      operations:
      - name: list-deployments
        method: GET
        description: Returns a list of GoldenGate deployments in a compartment
        inputParameters:
        - name: compartmentId
          in: query
          type: string
          required: true
          description: The OCID of the compartment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-deployment
        method: POST
        description: Creates a new GoldenGate deployment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            displayName: '{{tools.displayName}}'
            compartmentId: '{{tools.compartmentId}}'
            subnetId: '{{tools.subnetId}}'
      - name: get-deployment
        method: GET
        description: Returns details of a specific deployment
        inputParameters:
        - name: deploymentId
          in: path
          type: string
          required: true
          description: The OCID of the deployment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-deployment
        method: PUT
        description: Updates a deployment's configuration
        inputParameters:
        - name: deploymentId
          in: path
          type: string
          required: true
          description: The OCID of the deployment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            displayName: '{{tools.displayName}}'
      - name: delete-deployment
        method: DELETE
        description: Deletes a deployment
        inputParameters:
        - name: deploymentId
          in: path
          type: string
          required: true
          description: The OCID of the deployment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: start-deployment
        method: POST
        description: Starts a stopped deployment
        inputParameters:
        - name: deploymentId
          in: path
          type: string
          required: true
          description: The OCID of the deployment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: stop-deployment
        method: POST
        description: Stops a running deployment
        inputParameters:
        - name: deploymentId
          in: path
          type: string
          required: true
          description: The OCID of the deployment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: upgrade-deployment
        method: POST
        description: Upgrades a deployment to a newer version
        inputParameters:
        - name: deploymentId
          in: path
          type: string
          required: true
          description: The OCID of the deployment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: connections
      path: /20200407/connections
      description: Database and service connection management
      operations:
      - name: list-connections
        method: GET
        description: Returns a list of connections in a compartment
        inputParameters:
        - name: compartmentId
          in: query
          type: string
          required: true
          description: The OCID of the compartment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-connection
        method: POST
        description: Creates a new connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            displayName: '{{tools.displayName}}'
            compartmentId: '{{tools.compartmentId}}'
            connectionType: '{{tools.connectionType}}'
      - name: get-connection
        method: GET
        description: Returns a specific connection
        inputParameters:
        - name: connectionId
          in: path
          type: string
          required: true
          description: The OCID of the connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-connection
        method: DELETE
        description: Deletes a connection
        inputParameters:
        - name: connectionId
          in: path
          type: string
          required: true
          description: The OCID of the connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: pipelines
      path: /20200407/pipelines
      description: Data replication pipeline management
      operations:
      - name: list-pipelines
        method: GET
        description: Returns a list of data replication pipelines
        inputParameters:
        - name: compartmentId
          in: query
          type: string
          required: true
          description: The OCID of the compartment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-pipeline
        method: POST
        description: Creates a new pipeline
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            displayName: '{{tools.displayName}}'
            compartmentId: '{{tools.compartmentId}}'
      - name: get-pipeline
        method: GET
        description: Returns a specific pipeline
        inputParameters:
        - name: pipelineId
          in: path
          type: string
          required: true
          description: The OCID of the pipeline
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: start-pipeline
        method: POST
        description: Starts a stopped pipeline
        inputParameters:
        - name: pipelineId
          in: path
          type: string
          required: true
          description: The OCID of the pipeline
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: stop-pipeline
        method: POST
        description: Stops a running pipeline
        inputParameters:
        - name: pipelineId
          in: path
          type: string
          required: true
          description: The OCID of the pipeline
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: deployment-backups
      path: /20200407/deploymentBackups
      description: Deployment backup management
      operations:
      - name: list-deployment-backups
        method: GET
        description: Returns a list of deployment backups
        inputParameters:
        - name: compartmentId
          in: query
          type: string
          required: true
          description: The OCID of the compartment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-deployment-backup
        method: POST
        description: Creates a backup of a deployment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            displayName: '{{tools.displayName}}'
            deploymentId: '{{tools.deploymentId}}'
      - name: restore-deployment
        method: POST
        description: Restores a deployment from a backup
        inputParameters:
        - name: deploymentBackupId
          in: path
          type: string
          required: true
          description: The OCID of the backup
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: work-requests
      path: /20200407/workRequests
      description: Asynchronous operation tracking
      operations:
      - name: list-work-requests
        method: GET
        description: Returns a list of work requests
        inputParameters:
        - name: compartmentId
          in: query
          type: string
          required: true
          description: The OCID of the compartment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-work-request
        method: GET
        description: Returns a specific work request
        inputParameters:
        - name: workRequestId
          in: path
          type: string
          required: true
          description: The work request ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: goldengate-stream-analytics
    baseUri: https://{ggsa-host}:{port}/osa
    description: Oracle GoldenGate Stream Analytics REST API
    authentication:
      type: basic
      username: '{{GGSA_USERNAME}}'
      password: '{{GGSA_PASSWORD}}'
    resources:
    - name: pipelines
      path: /services/v1/pipelines
      description: Stream processing pipeline management
      operations:
      - name: list-pipelines
        method: GET
        description: Returns a list of all GGSA pipelines
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: export-pipeline
        method: GET
        description: Exports a pipeline and all its dependencies as JSON
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: Pipeline identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: publish-pipeline
        method: PATCH
        description: Publishes a pipeline to the Spark runtime
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: Pipeline identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: unpublish-pipeline
        method: PATCH
        description: Unpublishes a pipeline, stopping execution
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: Pipeline identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: artifacts
      path: /services/v1/artifacts
      description: Import and export GGSA artifacts
      operations:
      - name: import-artifacts
        method: PATCH
        description: Imports GGSA artifacts from a JSON document
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            pipeline: '{{tools.pipeline}}'
    - name: users
      path: /services/v1/authorizations
      description: User management and authorization
      operations:
      - name: list-users
        method: GET
        description: Returns users for a specific role
        inputParameters:
        - name: role
          in: path
          type: string
          required: true
          description: Authorization role
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-user
        method: GET
        description: Returns details of a specific user
        inputParameters:
        - name: role
          in: path
          type: string
          required: true
          description: Authorization role
        - name: user
          in: path
          type: string
          required: true
          description: Username
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-user
        method: POST
        description: Creates a new user with the specified role
        inputParameters:
        - name: role
          in: path
          type: string
          required: true
          description: Authorization role
        - name: user
          in: path
          type: string
          required: true
          description: Username
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            password: '{{tools.password}}'
  exposes:
  - type: rest
    port: 8081
    namespace: cloud-management-api
    description: Unified REST API for Oracle GoldenGate cloud deployment management.
    resources:
    - path: /v1/deployments
      name: deployments
      description: OCI GoldenGate deployment lifecycle management
      operations:
      - method: GET
        name: list-deployments
        description: List OCI GoldenGate deployments
        call: goldengate-cloud.list-deployments
        with:
          compartmentId: rest.compartmentId
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-deployment
        description: Create a new OCI deployment
        call: goldengate-cloud.create-deployment
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/deployments/{deploymentId}
      name: deployment-detail
      description: Individual deployment operations
      operations:
      - method: GET
        name: get-deployment
        description: Get deployment details
        call: goldengate-cloud.get-deployment
        with:
          deploymentId: rest.deploymentId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/connections
      name: connections
      description: Connection management
      operations:
      - method: GET
        name: list-connections
        description: List database and service connections
        call: goldengate-cloud.list-connections
        with:
          compartmentId: rest.compartmentId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/pipelines
      name: pipelines
      description: Data replication pipelines
      operations:
      - method: GET
        name: list-pipelines
        description: List data replication pipelines
        call: goldengate-cloud.list-pipelines
        with:
          compartmentId: rest.compartmentId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/backups
      name: backups
      description: Deployment backup management
      operations:
      - method: GET
        name: list-backups
        description: List deployment backups
        call: goldengate-cloud.list-deployment-backups
        with:
          compartmentId: rest.compartmentId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/stream-pipelines
      name: stream-pipelines
      description: Stream analytics pipeline management
      operations:
      - method: GET
        name: list-stream-pipelines
        description: List GGSA stream analytics pipelines
        call: goldengate-stream-analytics.list-pipelines
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/work-requests
      name: work-requests
      description: Async operation tracking
      operations:
      - method: GET
        name: list-work-requests
        description: List asynchronous work requests
        call: goldengate-cloud.list-work-requests
        with:
          compartmentId: rest.compartmentId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9091
    namespace: cloud-management-mcp
    transport: http
    description: MCP server for AI-assisted Oracle GoldenGate cloud management.
    tools:
    - name: list-deployments
      description: List OCI GoldenGate deployments in a compartment
      hints:
        readOnly: true
        openWorld: true
      call: goldengate-cloud.list-deployments
      with:
        compartmentId: tools.compartmentId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-deployment
      description: Get details of a specific OCI deployment
      hints:
        readOnly: true
        openWorld: true
      call: goldengate-cloud.get-deployment
      with:
        deploymentId: tools.deploymentId
      outputParameters:
      - type: object
        mapping: $.
    - name: create-deployment
      description: Create a new OCI GoldenGate deployment
      hints:
        readOnly: false
      call: goldengate-cloud.create-deployment
      with:
        displayName: tools.displayName
        compartmentId: tools.compartmentId
        subnetId: tools.subnetId
      outputParameters:
      - type: object
        mapping: $.
    - name: start-deployment
      description: Start a stopped OCI deployment
      hints:
        readOnly: false
      call: goldengate-cloud.start-deployment
      with:
        deploymentId: tools.deploymentId
      outputParameters:
      - type: object
        mapping: $.
    - name: stop-deployment
      description: Stop a running OCI deployment
      hints:
        readOnly: false
      call: goldengate-cloud.stop-deployment
      with:
        deploymentId: tools.deploymentId
      outputParameters:
      - type: object
        mapping: $.
    - name: upgrade-deployment
      description: Upgrade an OCI deployment to a newer version
      hints:
        readOnly: false
      call: goldengate-cloud.upgrade-deployment
      with:
        deploymentId: tools.deploymentId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-connections
      description: List database and service connections
      hints:
        readOnly: true
        openWorld: true
      call: goldengate-cloud.list-connections
      with:
        compartmentId: tools.compartmentId
      outputParameters:
      - type: object
        mapping: $.
    - name: create-connection
      description: Create a new connection for a source or target system
      hints:
        readOnly: false
      call: goldengate-cloud.create-connection
      with:
        displayName: tools.displayName
        compartmentId: tools.compartmentId
        connectionType: tools.connectionType
      outputParameters:
      - type: object
        mapping: $.
    - name: list-pipelines
      description: List data replication pipelines
      hints:
        readOnly: true
        openWorld: true
      call: goldengate-cloud.list-pipelines
      with:
        compartmentId: tools.compartmentId
      outputParameters:
      - type: object
        mapping: $.
    - name: create-pipeline
      description: Create a new data replication pipeline
      hints:
        readOnly: false
      call: goldengate-cloud.create-pipeline
      with:
        displayName: tools.displayName
        compartmentId: tools.compartmentId
      outputParameters:
      - type: object
        mapping: $.
    - name: start-pipeline
      description: Start a stopped pipeline
      hints:
        readOnly: false
      call: goldengate-cloud.start-pipeline
      with:
        pipelineId: tools.pipelineId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-backups
      description: List deployment backups
      hints:
        readOnly: true
        openWorld: true
      call: goldengate-cloud.list-deployment-backups
      with:
        compartmentId: tools.compartmentId
      outputParameters:
      - type: object
        mapping: $.
    - name: create-backup
      description: Create a deployment backup
      hints:
        readOnly: false
      call: goldengate-cloud.create-deployment-backup
      with:
        displayName: tools.displayName
        deploymentId: tools.deploymentId
      outputParameters:
      - type: object
        mapping: $.
    - name: restore-deployment
      description: Restore a deployment from a backup
      hints:
        readOnly: false
      call: goldengate-cloud.restore-deployment
      with:
        deploymentBackupId: tools.deploymentBackupId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-stream-pipelines
      description: List GGSA stream analytics pipelines
      hints:
        readOnly: true
        openWorld: true
      call: goldengate-stream-analytics.list-pipelines
      outputParameters:
      - type: object
        mapping: $.
    - name: publish-stream-pipeline
      description: Publish a stream analytics pipeline to the Spark runtime
      hints:
        readOnly: false
      call: goldengate-stream-analytics.publish-pipeline
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: unpublish-stream-pipeline
      description: Unpublish a stream analytics pipeline
      hints:
        readOnly: false
      call: goldengate-stream-analytics.unpublish-pipeline
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-work-request
      description: Check status of an asynchronous operation
      hints:
        readOnly: true
        openWorld: true
      call: goldengate-cloud.get-work-request
      with:
        workRequestId: tools.workRequestId
      outputParameters:
      - type: object
        mapping: $.
