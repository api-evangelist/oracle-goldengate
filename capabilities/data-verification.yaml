naftiko: 1.0.0-alpha2
info:
  label: Oracle GoldenGate Data Verification
  description: Unified workflow for verifying data consistency between source and target databases. Combines Veridata for
    data comparison and repair with core GoldenGate monitoring for data quality engineers and DBAs ensuring replication integrity.
  tags:
  - Oracle GoldenGate
  - Data Verification
  - Data Quality
  - Compliance
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    VERIDATA_USERNAME: VERIDATA_USERNAME
    VERIDATA_PASSWORD: VERIDATA_PASSWORD
    OGG_USERNAME: OGG_USERNAME
    OGG_PASSWORD: OGG_PASSWORD
capability:
  consumes:
  - type: http
    namespace: goldengate-veridata
    baseUri: https://{veridata-host}:{port}/veridata/v1
    description: Oracle GoldenGate Veridata REST API
    authentication:
      type: basic
      username: '{{VERIDATA_USERNAME}}'
      password: '{{VERIDATA_PASSWORD}}'
    resources:
    - name: server
      path: /services/server
      description: Server information and configuration
      operations:
      - name: get-server-info
        method: GET
        description: Returns server information including version and uptime
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-server-configuration
        method: GET
        description: Returns current server configuration settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: connections
      path: /services/connections
      description: Source and target database connection management
      operations:
      - name: list-connections
        method: GET
        description: Returns a list of database connections
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-connection
        method: POST
        description: Creates a new database connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
            host: '{{tools.host}}'
            port: '{{tools.port}}'
      - name: get-connection
        method: GET
        description: Returns a specific connection
        inputParameters:
        - name: connectionName
          in: path
          type: string
          required: true
          description: Connection name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-connection
        method: DELETE
        description: Deletes a database connection
        inputParameters:
        - name: connectionName
          in: path
          type: string
          required: true
          description: Connection name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: groups
      path: /services/groups
      description: Compare group management
      operations:
      - name: list-groups
        method: GET
        description: Returns a list of compare groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-group
        method: POST
        description: Creates a new compare group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
      - name: get-group
        method: GET
        description: Returns a specific compare group
        inputParameters:
        - name: groupName
          in: path
          type: string
          required: true
          description: Group name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-group
        method: DELETE
        description: Deletes a compare group
        inputParameters:
        - name: groupName
          in: path
          type: string
          required: true
          description: Group name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: jobs
      path: /services/jobs
      description: Comparison job management
      operations:
      - name: list-jobs
        method: GET
        description: Returns a list of comparison jobs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-job
        method: POST
        description: Creates a new comparison job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
            groupName: '{{tools.groupName}}'
      - name: get-job
        method: GET
        description: Returns a specific job
        inputParameters:
        - name: jobName
          in: path
          type: string
          required: true
          description: Job name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-job
        method: DELETE
        description: Deletes a comparison job
        inputParameters:
        - name: jobName
          in: path
          type: string
          required: true
          description: Job name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: execution
      path: /services/jobs
      description: Run and stop comparison jobs
      operations:
      - name: run-job
        method: POST
        description: Executes a comparison job
        inputParameters:
        - name: jobName
          in: path
          type: string
          required: true
          description: Job name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: stop-job
        method: POST
        description: Stops a running comparison job
        inputParameters:
        - name: jobName
          in: path
          type: string
          required: true
          description: Job name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: monitoring
      path: /services/monitoring
      description: Comparison and repair statistics
      operations:
      - name: get-job-statistics
        method: GET
        description: Returns statistics for a comparison job
        inputParameters:
        - name: jobName
          in: path
          type: string
          required: true
          description: Job name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-out-of-sync-data
        method: GET
        description: Returns out-of-sync data details
        inputParameters:
        - name: jobName
          in: path
          type: string
          required: true
          description: Job name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: repair
      path: /services/repair
      description: Repair out-of-sync data
      operations:
      - name: repair-job
        method: POST
        description: Initiates repair for out-of-sync data
        inputParameters:
        - name: jobName
          in: path
          type: string
          required: true
          description: Job name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: goldengate-rest
    baseUri: https://{goldengate-host}:{port}
    description: Oracle GoldenGate Microservices REST API
    authentication:
      type: basic
      username: '{{OGG_USERNAME}}'
      password: '{{OGG_PASSWORD}}'
    resources:
    - name: configuration
      path: /services
      description: API version and configuration management
      operations:
      - name: get-api-versions
        method: GET
        description: Returns the list of available REST API versions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: describe-api-version
        method: GET
        description: Returns details for a specific API version
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-config-summary
        method: GET
        description: Returns configuration summary
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: health
      path: /services/v2/config/health
      description: Service health monitoring
      operations:
      - name: get-service-health-details
        method: GET
        description: Returns detailed health information for the GoldenGate service
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-service-health-check
        method: GET
        description: Returns a quick health check status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: deployments
      path: /services/v2/deployments
      description: GoldenGate deployment management
      operations:
      - name: list-deployments
        method: GET
        description: Returns a list of GoldenGate deployments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-deployment
        method: GET
        description: Returns details of a specific deployment
        inputParameters:
        - name: deployment
          in: path
          type: string
          required: true
          description: Deployment name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-deployment
        method: POST
        description: Creates a new GoldenGate deployment
        inputParameters:
        - name: deployment
          in: path
          type: string
          required: true
          description: Deployment name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            config: '{{tools.config}}'
      - name: update-deployment
        method: PATCH
        description: Updates an existing deployment
        inputParameters:
        - name: deployment
          in: path
          type: string
          required: true
          description: Deployment name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            config: '{{tools.config}}'
      - name: delete-deployment
        method: DELETE
        description: Deletes a deployment
        inputParameters:
        - name: deployment
          in: path
          type: string
          required: true
          description: Deployment name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: extracts
      path: /services/v2/extracts
      description: Extract process management
      operations:
      - name: list-extracts
        method: GET
        description: Returns a list of all Extract processes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-extract
        method: GET
        description: Returns configuration and status of a specific Extract
        inputParameters:
        - name: extract
          in: path
          type: string
          required: true
          description: Extract process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-extract
        method: POST
        description: Creates a new Extract process
        inputParameters:
        - name: extract
          in: path
          type: string
          required: true
          description: Extract process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            type: '{{tools.type}}'
            trail: '{{tools.trail}}'
            config: '{{tools.config}}'
      - name: update-extract
        method: PATCH
        description: Updates an existing Extract process
        inputParameters:
        - name: extract
          in: path
          type: string
          required: true
          description: Extract process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            config: '{{tools.config}}'
      - name: delete-extract
        method: DELETE
        description: Deletes an Extract process
        inputParameters:
        - name: extract
          in: path
          type: string
          required: true
          description: Extract process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: issue-extract-command
        method: POST
        description: Issues a command (START, STOP, KILL, STATUS) to an Extract
        inputParameters:
        - name: extract
          in: path
          type: string
          required: true
          description: Extract process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            action: '{{tools.action}}'
    - name: replicats
      path: /services/v2/replicats
      description: Replicat process management
      operations:
      - name: list-replicats
        method: GET
        description: Returns a list of all Replicat processes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-replicat
        method: GET
        description: Returns configuration and status of a specific Replicat
        inputParameters:
        - name: replicat
          in: path
          type: string
          required: true
          description: Replicat process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-replicat
        method: POST
        description: Creates a new Replicat process
        inputParameters:
        - name: replicat
          in: path
          type: string
          required: true
          description: Replicat process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            type: '{{tools.type}}'
            trail: '{{tools.trail}}'
            config: '{{tools.config}}'
      - name: update-replicat
        method: PATCH
        description: Updates an existing Replicat process
        inputParameters:
        - name: replicat
          in: path
          type: string
          required: true
          description: Replicat process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            config: '{{tools.config}}'
      - name: delete-replicat
        method: DELETE
        description: Deletes a Replicat process
        inputParameters:
        - name: replicat
          in: path
          type: string
          required: true
          description: Replicat process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: issue-replicat-command
        method: POST
        description: Issues a command to a Replicat process
        inputParameters:
        - name: replicat
          in: path
          type: string
          required: true
          description: Replicat process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            action: '{{tools.action}}'
    - name: credentials
      path: /services/v2/credentials
      description: Credential store management
      operations:
      - name: list-credential-domains
        method: GET
        description: Returns all credential store domains
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-credential-alias
        method: GET
        description: Returns a credential alias
        inputParameters:
        - name: domain
          in: path
          type: string
          required: true
          description: Credential store domain
        - name: alias
          in: path
          type: string
          required: true
          description: Credential alias name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-credential-alias
        method: POST
        description: Creates a credential alias
        inputParameters:
        - name: domain
          in: path
          type: string
          required: true
          description: Credential store domain
        - name: alias
          in: path
          type: string
          required: true
          description: Credential alias name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            userid: '{{tools.userid}}'
            password: '{{tools.password}}'
    - name: distribution
      path: /services/v2/sources
      description: Distribution path management
      operations:
      - name: list-distribution-paths
        method: GET
        description: Returns distribution paths
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-distribution-path
        method: GET
        description: Returns a specific distribution path
        inputParameters:
        - name: distpath
          in: path
          type: string
          required: true
          description: Distribution path name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: monitoring
      path: /services/v2/mpoints
      description: Performance metrics and monitoring
      operations:
      - name: list-process-metrics
        method: GET
        description: Returns performance metrics for all running processes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-process-metrics
        method: GET
        description: Returns metrics for a specific process
        inputParameters:
        - name: item
          in: path
          type: string
          required: true
          description: Process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: commands
      path: /services/v2/commands
      description: Execute GoldenGate commands
      operations:
      - name: execute-command
        method: POST
        description: Executes a GGSCI-style command
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            command: '{{tools.command}}'
  exposes:
  - type: rest
    port: 8082
    namespace: data-verification-api
    description: Unified REST API for Oracle GoldenGate data verification workflows.
    resources:
    - path: /v1/connections
      name: connections
      description: Database connections for verification
      operations:
      - method: GET
        name: list-connections
        description: List Veridata database connections
        call: goldengate-veridata.list-connections
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/groups
      name: groups
      description: Compare groups
      operations:
      - method: GET
        name: list-groups
        description: List compare groups
        call: goldengate-veridata.list-groups
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/jobs
      name: jobs
      description: Comparison jobs
      operations:
      - method: GET
        name: list-jobs
        description: List comparison jobs
        call: goldengate-veridata.list-jobs
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/metrics
      name: metrics
      description: Replication process metrics
      operations:
      - method: GET
        name: list-process-metrics
        description: List replication process performance metrics
        call: goldengate-rest.list-process-metrics
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9092
    namespace: data-verification-mcp
    transport: http
    description: MCP server for AI-assisted data verification and comparison.
    tools:
    - name: list-connections
      description: List Veridata database connections
      hints:
        readOnly: true
        openWorld: true
      call: goldengate-veridata.list-connections
      outputParameters:
      - type: object
        mapping: $.
    - name: create-connection
      description: Create a new Veridata database connection
      hints:
        readOnly: false
      call: goldengate-veridata.create-connection
      with:
        name: tools.name
        host: tools.host
        port: tools.port
      outputParameters:
      - type: object
        mapping: $.
    - name: list-groups
      description: List compare groups for data verification
      hints:
        readOnly: true
        openWorld: true
      call: goldengate-veridata.list-groups
      outputParameters:
      - type: object
        mapping: $.
    - name: create-group
      description: Create a new compare group
      hints:
        readOnly: false
      call: goldengate-veridata.create-group
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: list-jobs
      description: List comparison jobs
      hints:
        readOnly: true
        openWorld: true
      call: goldengate-veridata.list-jobs
      outputParameters:
      - type: object
        mapping: $.
    - name: create-job
      description: Create a new comparison job
      hints:
        readOnly: false
      call: goldengate-veridata.create-job
      with:
        name: tools.name
        groupName: tools.groupName
      outputParameters:
      - type: object
        mapping: $.
    - name: run-job
      description: Execute a comparison job
      hints:
        readOnly: false
      call: goldengate-veridata.run-job
      with:
        jobName: tools.jobName
      outputParameters:
      - type: object
        mapping: $.
    - name: get-job-statistics
      description: Get comparison job statistics
      hints:
        readOnly: true
        openWorld: true
      call: goldengate-veridata.get-job-statistics
      with:
        jobName: tools.jobName
      outputParameters:
      - type: object
        mapping: $.
    - name: get-out-of-sync-data
      description: Get details of out-of-sync data
      hints:
        readOnly: true
        openWorld: true
      call: goldengate-veridata.get-out-of-sync-data
      with:
        jobName: tools.jobName
      outputParameters:
      - type: object
        mapping: $.
    - name: repair-job
      description: Repair out-of-sync data identified by a comparison job
      hints:
        readOnly: false
        destructive: true
      call: goldengate-veridata.repair-job
      with:
        jobName: tools.jobName
      outputParameters:
      - type: object
        mapping: $.
    - name: get-server-info
      description: Get Veridata server information
      hints:
        readOnly: true
        openWorld: true
      call: goldengate-veridata.get-server-info
      outputParameters:
      - type: object
        mapping: $.
    - name: list-process-metrics
      description: Get GoldenGate process performance metrics for monitoring replication health
      hints:
        readOnly: true
        openWorld: true
      call: goldengate-rest.list-process-metrics
      outputParameters:
      - type: object
        mapping: $.
