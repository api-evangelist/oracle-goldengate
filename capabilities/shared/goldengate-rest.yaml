naftiko: "1.0.0-alpha1"

info:
  label: "Oracle GoldenGate REST API"
  description: "RESTful API for managing Oracle GoldenGate Microservices Architecture, including deployment configuration, extract and replicat process management, credentials, database connections, distribution and receiver services, performance metrics, and monitoring."
  tags:
    - Oracle GoldenGate
    - Data Replication
    - CDC
    - ETL
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      OGG_USERNAME: OGG_USERNAME
      OGG_PASSWORD: OGG_PASSWORD

capability:
  consumes:
    - type: http
      namespace: goldengate-rest
      baseUri: https://{goldengate-host}:{port}
      description: "Oracle GoldenGate Microservices REST API"
      authentication:
        type: basic
        username: "{{OGG_USERNAME}}"
        password: "{{OGG_PASSWORD}}"
      resources:
        - name: configuration
          path: /services
          description: "API version and configuration management"
          operations:
            - name: get-api-versions
              method: GET
              description: "Returns the list of available REST API versions"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: describe-api-version
              method: GET
              description: "Returns details for a specific API version"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-config-summary
              method: GET
              description: "Returns configuration summary"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: health
          path: /services/v2/config/health
          description: "Service health monitoring"
          operations:
            - name: get-service-health-details
              method: GET
              description: "Returns detailed health information for the GoldenGate service"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-service-health-check
              method: GET
              description: "Returns a quick health check status"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: deployments
          path: /services/v2/deployments
          description: "GoldenGate deployment management"
          operations:
            - name: list-deployments
              method: GET
              description: "Returns a list of GoldenGate deployments"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-deployment
              method: GET
              description: "Returns details of a specific deployment"
              inputParameters:
                - name: deployment
                  in: path
                  type: string
                  required: true
                  description: "Deployment name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-deployment
              method: POST
              description: "Creates a new GoldenGate deployment"
              inputParameters:
                - name: deployment
                  in: path
                  type: string
                  required: true
                  description: "Deployment name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  config: "{{tools.config}}"
            - name: update-deployment
              method: PATCH
              description: "Updates an existing deployment"
              inputParameters:
                - name: deployment
                  in: path
                  type: string
                  required: true
                  description: "Deployment name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  config: "{{tools.config}}"
            - name: delete-deployment
              method: DELETE
              description: "Deletes a deployment"
              inputParameters:
                - name: deployment
                  in: path
                  type: string
                  required: true
                  description: "Deployment name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: extracts
          path: /services/v2/extracts
          description: "Extract process management"
          operations:
            - name: list-extracts
              method: GET
              description: "Returns a list of all Extract processes"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-extract
              method: GET
              description: "Returns configuration and status of a specific Extract"
              inputParameters:
                - name: extract
                  in: path
                  type: string
                  required: true
                  description: "Extract process name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-extract
              method: POST
              description: "Creates a new Extract process"
              inputParameters:
                - name: extract
                  in: path
                  type: string
                  required: true
                  description: "Extract process name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  type: "{{tools.type}}"
                  trail: "{{tools.trail}}"
                  config: "{{tools.config}}"
            - name: update-extract
              method: PATCH
              description: "Updates an existing Extract process"
              inputParameters:
                - name: extract
                  in: path
                  type: string
                  required: true
                  description: "Extract process name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  config: "{{tools.config}}"
            - name: delete-extract
              method: DELETE
              description: "Deletes an Extract process"
              inputParameters:
                - name: extract
                  in: path
                  type: string
                  required: true
                  description: "Extract process name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: issue-extract-command
              method: POST
              description: "Issues a command (START, STOP, KILL, STATUS) to an Extract"
              inputParameters:
                - name: extract
                  in: path
                  type: string
                  required: true
                  description: "Extract process name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  action: "{{tools.action}}"
        - name: replicats
          path: /services/v2/replicats
          description: "Replicat process management"
          operations:
            - name: list-replicats
              method: GET
              description: "Returns a list of all Replicat processes"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-replicat
              method: GET
              description: "Returns configuration and status of a specific Replicat"
              inputParameters:
                - name: replicat
                  in: path
                  type: string
                  required: true
                  description: "Replicat process name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-replicat
              method: POST
              description: "Creates a new Replicat process"
              inputParameters:
                - name: replicat
                  in: path
                  type: string
                  required: true
                  description: "Replicat process name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  type: "{{tools.type}}"
                  trail: "{{tools.trail}}"
                  config: "{{tools.config}}"
            - name: update-replicat
              method: PATCH
              description: "Updates an existing Replicat process"
              inputParameters:
                - name: replicat
                  in: path
                  type: string
                  required: true
                  description: "Replicat process name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  config: "{{tools.config}}"
            - name: delete-replicat
              method: DELETE
              description: "Deletes a Replicat process"
              inputParameters:
                - name: replicat
                  in: path
                  type: string
                  required: true
                  description: "Replicat process name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: issue-replicat-command
              method: POST
              description: "Issues a command to a Replicat process"
              inputParameters:
                - name: replicat
                  in: path
                  type: string
                  required: true
                  description: "Replicat process name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  action: "{{tools.action}}"
        - name: credentials
          path: /services/v2/credentials
          description: "Credential store management"
          operations:
            - name: list-credential-domains
              method: GET
              description: "Returns all credential store domains"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-credential-alias
              method: GET
              description: "Returns a credential alias"
              inputParameters:
                - name: domain
                  in: path
                  type: string
                  required: true
                  description: "Credential store domain"
                - name: alias
                  in: path
                  type: string
                  required: true
                  description: "Credential alias name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-credential-alias
              method: POST
              description: "Creates a credential alias"
              inputParameters:
                - name: domain
                  in: path
                  type: string
                  required: true
                  description: "Credential store domain"
                - name: alias
                  in: path
                  type: string
                  required: true
                  description: "Credential alias name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  userid: "{{tools.userid}}"
                  password: "{{tools.password}}"
        - name: distribution
          path: /services/v2/sources
          description: "Distribution path management"
          operations:
            - name: list-distribution-paths
              method: GET
              description: "Returns distribution paths"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-distribution-path
              method: GET
              description: "Returns a specific distribution path"
              inputParameters:
                - name: distpath
                  in: path
                  type: string
                  required: true
                  description: "Distribution path name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: monitoring
          path: /services/v2/mpoints
          description: "Performance metrics and monitoring"
          operations:
            - name: list-process-metrics
              method: GET
              description: "Returns performance metrics for all running processes"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-process-metrics
              method: GET
              description: "Returns metrics for a specific process"
              inputParameters:
                - name: item
                  in: path
                  type: string
                  required: true
                  description: "Process name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: commands
          path: /services/v2/commands
          description: "Execute GoldenGate commands"
          operations:
            - name: execute-command
              method: POST
              description: "Executes a GGSCI-style command"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  command: "{{tools.command}}"

  exposes:
    - type: rest
      port: 8100
      namespace: goldengate-rest-api
      resources:
        - path: /v1/extracts
          name: extracts
          description: "Extract process management"
          operations:
            - method: GET
              name: list-extracts
              description: "List all Extract processes"
        - path: /v1/replicats
          name: replicats
          description: "Replicat process management"
          operations:
            - method: GET
              name: list-replicats
              description: "List all Replicat processes"
        - path: /v1/deployments
          name: deployments
          description: "Deployment management"
          operations:
            - method: GET
              name: list-deployments
              description: "List deployments"

    - type: mcp
      port: 9100
      namespace: goldengate-rest-mcp
      transport: http
      tools:
        - name: list-extracts
          description: "List all Extract processes"
          hints:
            readOnly: true
            openWorld: true
          call: "goldengate-rest.list-extracts"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-replicats
          description: "List all Replicat processes"
          hints:
            readOnly: true
            openWorld: true
          call: "goldengate-rest.list-replicats"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-deployments
          description: "List GoldenGate deployments"
          hints:
            readOnly: true
            openWorld: true
          call: "goldengate-rest.list-deployments"
          outputParameters:
            - type: object
              mapping: "$."
        - name: execute-command
          description: "Execute a GGSCI-style command"
          hints:
            readOnly: false
            openWorld: true
          call: "goldengate-rest.execute-command"
          with:
            command: "tools.command"
          outputParameters:
            - type: object
              mapping: "$."
