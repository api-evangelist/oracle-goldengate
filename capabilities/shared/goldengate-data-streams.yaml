naftiko: "1.0.0-alpha1"

info:
  label: "Oracle GoldenGate Data Streams REST API"
  description: "REST API for managing Oracle GoldenGate Data Streams, enabling real-time data distribution to downstream consumers via the Distribution Server."
  tags:
    - Oracle GoldenGate
    - Data Streams
    - Real-Time
    - Streaming
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      OGG_DS_USERNAME: OGG_DS_USERNAME
      OGG_DS_PASSWORD: OGG_DS_PASSWORD

capability:
  consumes:
    - type: http
      namespace: goldengate-data-streams
      baseUri: https://{goldengate-host}:{port}
      description: "Oracle GoldenGate Data Streams REST API"
      authentication:
        type: basic
        username: "{{OGG_DS_USERNAME}}"
        password: "{{OGG_DS_PASSWORD}}"
      resources:
        - name: data-streams
          path: /services/v2/stream
          description: "Data stream configuration management"
          operations:
            - name: list-data-streams
              method: GET
              description: "Returns a list of all configured data streams"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-data-stream
              method: GET
              description: "Returns configuration of a specific data stream"
              inputParameters:
                - name: streamname
                  in: path
                  type: string
                  required: true
                  description: "Data stream name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-data-stream
              method: POST
              description: "Creates a new data stream configuration"
              inputParameters:
                - name: streamname
                  in: path
                  type: string
                  required: true
                  description: "Data stream name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  description: "{{tools.description}}"
                  source: "{{tools.source}}"
                  target: "{{tools.target}}"
            - name: update-data-stream
              method: PATCH
              description: "Updates an existing data stream"
              inputParameters:
                - name: streamname
                  in: path
                  type: string
                  required: true
                  description: "Data stream name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  description: "{{tools.description}}"
            - name: delete-data-stream
              method: DELETE
              description: "Deletes a data stream"
              inputParameters:
                - name: streamname
                  in: path
                  type: string
                  required: true
                  description: "Data stream name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: asyncapi
          path: /services/v2/stream
          description: "AsyncAPI specification management"
          operations:
            - name: get-asyncapi-spec
              method: GET
              description: "Retrieves the AsyncAPI specification for a data stream"
              inputParameters:
                - name: streamname
                  in: path
                  type: string
                  required: true
                  description: "Data stream name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-asyncapi-spec
              method: PATCH
              description: "Updates the AsyncAPI specification for a data stream"
              inputParameters:
                - name: streamname
                  in: path
                  type: string
                  required: true
                  description: "Data stream name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8105
      namespace: goldengate-data-streams-api
      resources:
        - path: /v1/data-streams
          name: data-streams
          description: "Data stream management"
          operations:
            - method: GET
              name: list-data-streams
              description: "List data streams"

    - type: mcp
      port: 9105
      namespace: goldengate-data-streams-mcp
      transport: http
      tools:
        - name: list-data-streams
          description: "List all configured data streams"
          hints:
            readOnly: true
            openWorld: true
          call: "goldengate-data-streams.list-data-streams"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-data-stream
          description: "Get configuration of a data stream"
          hints:
            readOnly: true
            openWorld: true
          call: "goldengate-data-streams.get-data-stream"
          with:
            streamname: "tools.streamname"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-data-stream
          description: "Create a new data stream"
          hints:
            readOnly: false
            openWorld: true
          call: "goldengate-data-streams.create-data-stream"
          with:
            streamname: "tools.streamname"
            description: "tools.description"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-data-stream
          description: "Delete a data stream"
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "goldengate-data-streams.delete-data-stream"
          with:
            streamname: "tools.streamname"
          outputParameters:
            - type: object
              mapping: "$."
