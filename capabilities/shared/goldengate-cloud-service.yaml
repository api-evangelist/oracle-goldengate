naftiko: "1.0.0-alpha1"

info:
  label: "Oracle GoldenGate Cloud Service API"
  description: "Oracle Cloud Infrastructure API for managing GoldenGate deployments, connections, backups, database registrations, pipelines, and certificates in OCI."
  tags:
    - Oracle GoldenGate
    - OCI
    - Cloud
    - Database Migration
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      OCI_API_KEY: OCI_API_KEY

capability:
  consumes:
    - type: http
      namespace: goldengate-cloud
      baseUri: https://goldengate.{region}.oci.oraclecloud.com
      description: "OCI GoldenGate Cloud Service API"
      authentication:
        type: bearer
        token: "{{OCI_API_KEY}}"
      resources:
        - name: deployments
          path: /20200407/deployments
          description: "GoldenGate deployment management in OCI"
          operations:
            - name: list-deployments
              method: GET
              description: "Returns a list of GoldenGate deployments in a compartment"
              inputParameters:
                - name: compartmentId
                  in: query
                  type: string
                  required: true
                  description: "The OCID of the compartment"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-deployment
              method: POST
              description: "Creates a new GoldenGate deployment"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  displayName: "{{tools.displayName}}"
                  compartmentId: "{{tools.compartmentId}}"
                  subnetId: "{{tools.subnetId}}"
            - name: get-deployment
              method: GET
              description: "Returns details of a specific deployment"
              inputParameters:
                - name: deploymentId
                  in: path
                  type: string
                  required: true
                  description: "The OCID of the deployment"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-deployment
              method: PUT
              description: "Updates a deployment's configuration"
              inputParameters:
                - name: deploymentId
                  in: path
                  type: string
                  required: true
                  description: "The OCID of the deployment"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  displayName: "{{tools.displayName}}"
            - name: delete-deployment
              method: DELETE
              description: "Deletes a deployment"
              inputParameters:
                - name: deploymentId
                  in: path
                  type: string
                  required: true
                  description: "The OCID of the deployment"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: start-deployment
              method: POST
              description: "Starts a stopped deployment"
              inputParameters:
                - name: deploymentId
                  in: path
                  type: string
                  required: true
                  description: "The OCID of the deployment"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: stop-deployment
              method: POST
              description: "Stops a running deployment"
              inputParameters:
                - name: deploymentId
                  in: path
                  type: string
                  required: true
                  description: "The OCID of the deployment"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: upgrade-deployment
              method: POST
              description: "Upgrades a deployment to a newer version"
              inputParameters:
                - name: deploymentId
                  in: path
                  type: string
                  required: true
                  description: "The OCID of the deployment"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: connections
          path: /20200407/connections
          description: "Database and service connection management"
          operations:
            - name: list-connections
              method: GET
              description: "Returns a list of connections in a compartment"
              inputParameters:
                - name: compartmentId
                  in: query
                  type: string
                  required: true
                  description: "The OCID of the compartment"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-connection
              method: POST
              description: "Creates a new connection"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  displayName: "{{tools.displayName}}"
                  compartmentId: "{{tools.compartmentId}}"
                  connectionType: "{{tools.connectionType}}"
            - name: get-connection
              method: GET
              description: "Returns a specific connection"
              inputParameters:
                - name: connectionId
                  in: path
                  type: string
                  required: true
                  description: "The OCID of the connection"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-connection
              method: DELETE
              description: "Deletes a connection"
              inputParameters:
                - name: connectionId
                  in: path
                  type: string
                  required: true
                  description: "The OCID of the connection"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: pipelines
          path: /20200407/pipelines
          description: "Data replication pipeline management"
          operations:
            - name: list-pipelines
              method: GET
              description: "Returns a list of data replication pipelines"
              inputParameters:
                - name: compartmentId
                  in: query
                  type: string
                  required: true
                  description: "The OCID of the compartment"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-pipeline
              method: POST
              description: "Creates a new pipeline"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  displayName: "{{tools.displayName}}"
                  compartmentId: "{{tools.compartmentId}}"
            - name: get-pipeline
              method: GET
              description: "Returns a specific pipeline"
              inputParameters:
                - name: pipelineId
                  in: path
                  type: string
                  required: true
                  description: "The OCID of the pipeline"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: start-pipeline
              method: POST
              description: "Starts a stopped pipeline"
              inputParameters:
                - name: pipelineId
                  in: path
                  type: string
                  required: true
                  description: "The OCID of the pipeline"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: stop-pipeline
              method: POST
              description: "Stops a running pipeline"
              inputParameters:
                - name: pipelineId
                  in: path
                  type: string
                  required: true
                  description: "The OCID of the pipeline"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: deployment-backups
          path: /20200407/deploymentBackups
          description: "Deployment backup management"
          operations:
            - name: list-deployment-backups
              method: GET
              description: "Returns a list of deployment backups"
              inputParameters:
                - name: compartmentId
                  in: query
                  type: string
                  required: true
                  description: "The OCID of the compartment"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-deployment-backup
              method: POST
              description: "Creates a backup of a deployment"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  displayName: "{{tools.displayName}}"
                  deploymentId: "{{tools.deploymentId}}"
            - name: restore-deployment
              method: POST
              description: "Restores a deployment from a backup"
              inputParameters:
                - name: deploymentBackupId
                  in: path
                  type: string
                  required: true
                  description: "The OCID of the backup"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: work-requests
          path: /20200407/workRequests
          description: "Asynchronous operation tracking"
          operations:
            - name: list-work-requests
              method: GET
              description: "Returns a list of work requests"
              inputParameters:
                - name: compartmentId
                  in: query
                  type: string
                  required: true
                  description: "The OCID of the compartment"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-work-request
              method: GET
              description: "Returns a specific work request"
              inputParameters:
                - name: workRequestId
                  in: path
                  type: string
                  required: true
                  description: "The work request ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8103
      namespace: goldengate-cloud-api
      resources:
        - path: /v1/deployments
          name: deployments
          description: "OCI deployment management"
          operations:
            - method: GET
              name: list-deployments
              description: "List OCI GoldenGate deployments"
        - path: /v1/connections
          name: connections
          description: "Connection management"
          operations:
            - method: GET
              name: list-connections
              description: "List connections"
        - path: /v1/pipelines
          name: pipelines
          description: "Pipeline management"
          operations:
            - method: GET
              name: list-pipelines
              description: "List pipelines"

    - type: mcp
      port: 9103
      namespace: goldengate-cloud-mcp
      transport: http
      tools:
        - name: list-deployments
          description: "List OCI GoldenGate deployments"
          hints:
            readOnly: true
            openWorld: true
          call: "goldengate-cloud.list-deployments"
          with:
            compartmentId: "tools.compartmentId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-connections
          description: "List GoldenGate connections"
          hints:
            readOnly: true
            openWorld: true
          call: "goldengate-cloud.list-connections"
          with:
            compartmentId: "tools.compartmentId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-pipelines
          description: "List data replication pipelines"
          hints:
            readOnly: true
            openWorld: true
          call: "goldengate-cloud.list-pipelines"
          with:
            compartmentId: "tools.compartmentId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: start-deployment
          description: "Start an OCI GoldenGate deployment"
          hints:
            readOnly: false
            openWorld: true
          call: "goldengate-cloud.start-deployment"
          with:
            deploymentId: "tools.deploymentId"
          outputParameters:
            - type: object
              mapping: "$."
