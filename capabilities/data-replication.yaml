naftiko: 1.0.0-alpha2
info:
  label: Oracle GoldenGate Data Replication
  description: Unified workflow for managing real-time data replication across on-premises and cloud environments. Combines
    the core GoldenGate REST API, Big Data API, and Data Streams API for data integration engineers managing CDC pipelines,
    extract/replicat processes, and data distribution.
  tags:
  - Oracle GoldenGate
  - Data Replication
  - CDC
  - Data Integration
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    OGG_USERNAME: OGG_USERNAME
    OGG_PASSWORD: OGG_PASSWORD
    OGG_BD_USERNAME: OGG_BD_USERNAME
    OGG_BD_PASSWORD: OGG_BD_PASSWORD
    OGG_DS_USERNAME: OGG_DS_USERNAME
    OGG_DS_PASSWORD: OGG_DS_PASSWORD
capability:
  consumes:
  - type: http
    namespace: goldengate-rest
    baseUri: https://{goldengate-host}:{port}
    description: Oracle GoldenGate Microservices REST API
    authentication:
      type: basic
      username: '{{OGG_USERNAME}}'
      password: '{{OGG_PASSWORD}}'
    resources:
    - name: configuration
      path: /services
      description: API version and configuration management
      operations:
      - name: get-api-versions
        method: GET
        description: Returns the list of available REST API versions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: describe-api-version
        method: GET
        description: Returns details for a specific API version
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-config-summary
        method: GET
        description: Returns configuration summary
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: health
      path: /services/v2/config/health
      description: Service health monitoring
      operations:
      - name: get-service-health-details
        method: GET
        description: Returns detailed health information for the GoldenGate service
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-service-health-check
        method: GET
        description: Returns a quick health check status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: deployments
      path: /services/v2/deployments
      description: GoldenGate deployment management
      operations:
      - name: list-deployments
        method: GET
        description: Returns a list of GoldenGate deployments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-deployment
        method: GET
        description: Returns details of a specific deployment
        inputParameters:
        - name: deployment
          in: path
          type: string
          required: true
          description: Deployment name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-deployment
        method: POST
        description: Creates a new GoldenGate deployment
        inputParameters:
        - name: deployment
          in: path
          type: string
          required: true
          description: Deployment name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            config: '{{tools.config}}'
      - name: update-deployment
        method: PATCH
        description: Updates an existing deployment
        inputParameters:
        - name: deployment
          in: path
          type: string
          required: true
          description: Deployment name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            config: '{{tools.config}}'
      - name: delete-deployment
        method: DELETE
        description: Deletes a deployment
        inputParameters:
        - name: deployment
          in: path
          type: string
          required: true
          description: Deployment name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: extracts
      path: /services/v2/extracts
      description: Extract process management
      operations:
      - name: list-extracts
        method: GET
        description: Returns a list of all Extract processes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-extract
        method: GET
        description: Returns configuration and status of a specific Extract
        inputParameters:
        - name: extract
          in: path
          type: string
          required: true
          description: Extract process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-extract
        method: POST
        description: Creates a new Extract process
        inputParameters:
        - name: extract
          in: path
          type: string
          required: true
          description: Extract process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            type: '{{tools.type}}'
            trail: '{{tools.trail}}'
            config: '{{tools.config}}'
      - name: update-extract
        method: PATCH
        description: Updates an existing Extract process
        inputParameters:
        - name: extract
          in: path
          type: string
          required: true
          description: Extract process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            config: '{{tools.config}}'
      - name: delete-extract
        method: DELETE
        description: Deletes an Extract process
        inputParameters:
        - name: extract
          in: path
          type: string
          required: true
          description: Extract process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: issue-extract-command
        method: POST
        description: Issues a command (START, STOP, KILL, STATUS) to an Extract
        inputParameters:
        - name: extract
          in: path
          type: string
          required: true
          description: Extract process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            action: '{{tools.action}}'
    - name: replicats
      path: /services/v2/replicats
      description: Replicat process management
      operations:
      - name: list-replicats
        method: GET
        description: Returns a list of all Replicat processes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-replicat
        method: GET
        description: Returns configuration and status of a specific Replicat
        inputParameters:
        - name: replicat
          in: path
          type: string
          required: true
          description: Replicat process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-replicat
        method: POST
        description: Creates a new Replicat process
        inputParameters:
        - name: replicat
          in: path
          type: string
          required: true
          description: Replicat process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            type: '{{tools.type}}'
            trail: '{{tools.trail}}'
            config: '{{tools.config}}'
      - name: update-replicat
        method: PATCH
        description: Updates an existing Replicat process
        inputParameters:
        - name: replicat
          in: path
          type: string
          required: true
          description: Replicat process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            config: '{{tools.config}}'
      - name: delete-replicat
        method: DELETE
        description: Deletes a Replicat process
        inputParameters:
        - name: replicat
          in: path
          type: string
          required: true
          description: Replicat process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: issue-replicat-command
        method: POST
        description: Issues a command to a Replicat process
        inputParameters:
        - name: replicat
          in: path
          type: string
          required: true
          description: Replicat process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            action: '{{tools.action}}'
    - name: credentials
      path: /services/v2/credentials
      description: Credential store management
      operations:
      - name: list-credential-domains
        method: GET
        description: Returns all credential store domains
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-credential-alias
        method: GET
        description: Returns a credential alias
        inputParameters:
        - name: domain
          in: path
          type: string
          required: true
          description: Credential store domain
        - name: alias
          in: path
          type: string
          required: true
          description: Credential alias name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-credential-alias
        method: POST
        description: Creates a credential alias
        inputParameters:
        - name: domain
          in: path
          type: string
          required: true
          description: Credential store domain
        - name: alias
          in: path
          type: string
          required: true
          description: Credential alias name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            userid: '{{tools.userid}}'
            password: '{{tools.password}}'
    - name: distribution
      path: /services/v2/sources
      description: Distribution path management
      operations:
      - name: list-distribution-paths
        method: GET
        description: Returns distribution paths
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-distribution-path
        method: GET
        description: Returns a specific distribution path
        inputParameters:
        - name: distpath
          in: path
          type: string
          required: true
          description: Distribution path name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: monitoring
      path: /services/v2/mpoints
      description: Performance metrics and monitoring
      operations:
      - name: list-process-metrics
        method: GET
        description: Returns performance metrics for all running processes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-process-metrics
        method: GET
        description: Returns metrics for a specific process
        inputParameters:
        - name: item
          in: path
          type: string
          required: true
          description: Process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: commands
      path: /services/v2/commands
      description: Execute GoldenGate commands
      operations:
      - name: execute-command
        method: POST
        description: Executes a GGSCI-style command
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            command: '{{tools.command}}'
  - type: http
    namespace: goldengate-big-data
    baseUri: https://{goldengate-host}:{port}
    description: Oracle GoldenGate for Big Data REST API
    authentication:
      type: basic
      username: '{{OGG_BD_USERNAME}}'
      password: '{{OGG_BD_PASSWORD}}'
    resources:
    - name: health
      path: /services/v2/config/health
      description: Service health monitoring
      operations:
      - name: get-service-health
        method: GET
        description: Returns health information for the Big Data service
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: extracts
      path: /services/v2/extracts
      description: Extract process management for source data capture
      operations:
      - name: list-extracts
        method: GET
        description: Returns a list of all Extract processes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-extract
        method: GET
        description: Returns a specific Extract process
        inputParameters:
        - name: extract
          in: path
          type: string
          required: true
          description: Extract process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-extract
        method: POST
        description: Creates a new Extract process
        inputParameters:
        - name: extract
          in: path
          type: string
          required: true
          description: Extract process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            type: '{{tools.type}}'
            trail: '{{tools.trail}}'
      - name: delete-extract
        method: DELETE
        description: Deletes an Extract process
        inputParameters:
        - name: extract
          in: path
          type: string
          required: true
          description: Extract process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: issue-extract-command
        method: POST
        description: Issues a command to an Extract process
        inputParameters:
        - name: extract
          in: path
          type: string
          required: true
          description: Extract process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            action: '{{tools.action}}'
    - name: replicats
      path: /services/v2/replicats
      description: Replicat process management for big data targets
      operations:
      - name: list-replicats
        method: GET
        description: Returns a list of all Replicat processes for big data targets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-replicat
        method: GET
        description: Returns a Replicat targeting a big data system
        inputParameters:
        - name: replicat
          in: path
          type: string
          required: true
          description: Replicat process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-replicat
        method: POST
        description: Creates a new Replicat with a big data handler
        inputParameters:
        - name: replicat
          in: path
          type: string
          required: true
          description: Replicat process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            type: '{{tools.type}}'
            trail: '{{tools.trail}}'
      - name: delete-replicat
        method: DELETE
        description: Deletes a Replicat process
        inputParameters:
        - name: replicat
          in: path
          type: string
          required: true
          description: Replicat process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-replicat-status
        method: GET
        description: Returns runtime status of a big data Replicat
        inputParameters:
        - name: replicat
          in: path
          type: string
          required: true
          description: Replicat process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: data-targets
      path: /services/v2/dataTargetTypes
      description: Big data target type configurations
      operations:
      - name: list-data-target-types
        method: GET
        description: Returns available big data target types
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-data-target-type-schema
        method: GET
        description: Returns JSON schema for a data target type
        inputParameters:
        - name: dataTargetType
          in: path
          type: string
          required: true
          description: Data target type name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: credentials
      path: /services/v2/credentials
      description: Credential store for big data target authentication
      operations:
      - name: list-credential-domains
        method: GET
        description: Returns all credential store domains
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: monitoring
      path: /services/v2/mpoints
      description: Performance metrics and monitoring
      operations:
      - name: list-process-metrics
        method: GET
        description: Returns performance metrics for all running processes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-replicat-stats
        method: GET
        description: Returns handler-level statistics for a big data Replicat
        inputParameters:
        - name: item
          in: path
          type: string
          required: true
          description: Process name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: goldengate-data-streams
    baseUri: https://{goldengate-host}:{port}
    description: Oracle GoldenGate Data Streams REST API
    authentication:
      type: basic
      username: '{{OGG_DS_USERNAME}}'
      password: '{{OGG_DS_PASSWORD}}'
    resources:
    - name: data-streams
      path: /services/v2/stream
      description: Data stream configuration management
      operations:
      - name: list-data-streams
        method: GET
        description: Returns a list of all configured data streams
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-data-stream
        method: GET
        description: Returns configuration of a specific data stream
        inputParameters:
        - name: streamname
          in: path
          type: string
          required: true
          description: Data stream name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-data-stream
        method: POST
        description: Creates a new data stream configuration
        inputParameters:
        - name: streamname
          in: path
          type: string
          required: true
          description: Data stream name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            description: '{{tools.description}}'
            source: '{{tools.source}}'
            target: '{{tools.target}}'
      - name: update-data-stream
        method: PATCH
        description: Updates an existing data stream
        inputParameters:
        - name: streamname
          in: path
          type: string
          required: true
          description: Data stream name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            description: '{{tools.description}}'
      - name: delete-data-stream
        method: DELETE
        description: Deletes a data stream
        inputParameters:
        - name: streamname
          in: path
          type: string
          required: true
          description: Data stream name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: asyncapi
      path: /services/v2/stream
      description: AsyncAPI specification management
      operations:
      - name: get-asyncapi-spec
        method: GET
        description: Retrieves the AsyncAPI specification for a data stream
        inputParameters:
        - name: streamname
          in: path
          type: string
          required: true
          description: Data stream name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-asyncapi-spec
        method: PATCH
        description: Updates the AsyncAPI specification for a data stream
        inputParameters:
        - name: streamname
          in: path
          type: string
          required: true
          description: Data stream name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: data-replication-api
    description: Unified REST API for Oracle GoldenGate data replication workflows.
    resources:
    - path: /v1/extracts
      name: extracts
      description: Extract process management across core and big data deployments
      operations:
      - method: GET
        name: list-extracts
        description: List all Extract processes
        call: goldengate-rest.list-extracts
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-extract
        description: Create a new Extract process
        call: goldengate-rest.create-extract
        with:
          extract: rest.extract
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/extracts/{extract}
      name: extract-detail
      description: Individual extract operations
      operations:
      - method: GET
        name: get-extract
        description: Get a specific Extract process
        call: goldengate-rest.get-extract
        with:
          extract: rest.extract
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete-extract
        description: Delete an Extract process
        call: goldengate-rest.delete-extract
        with:
          extract: rest.extract
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/replicats
      name: replicats
      description: Replicat process management
      operations:
      - method: GET
        name: list-replicats
        description: List all Replicat processes
        call: goldengate-rest.list-replicats
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/big-data-replicats
      name: big-data-replicats
      description: Big data Replicat processes
      operations:
      - method: GET
        name: list-big-data-replicats
        description: List all big data Replicat processes
        call: goldengate-big-data.list-replicats
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data-streams
      name: data-streams
      description: Data stream management
      operations:
      - method: GET
        name: list-data-streams
        description: List all data streams
        call: goldengate-data-streams.list-data-streams
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data-target-types
      name: data-target-types
      description: Available big data target types
      operations:
      - method: GET
        name: list-data-target-types
        description: List available big data target types
        call: goldengate-big-data.list-data-target-types
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/credentials
      name: credentials
      description: Credential store management
      operations:
      - method: GET
        name: list-credential-domains
        description: List credential domains
        call: goldengate-rest.list-credential-domains
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/distribution-paths
      name: distribution-paths
      description: Distribution path management
      operations:
      - method: GET
        name: list-distribution-paths
        description: List distribution paths
        call: goldengate-rest.list-distribution-paths
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/health
      name: health
      description: Service health
      operations:
      - method: GET
        name: get-service-health
        description: Get service health details
        call: goldengate-big-data.get-service-health
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: data-replication-mcp
    transport: http
    description: MCP server for AI-assisted Oracle GoldenGate data replication management.
    tools:
    - name: core-list-extracts
      description: List all Extract processes from the core GoldenGate deployment
      hints:
        readOnly: true
        openWorld: true
      call: goldengate-rest.list-extracts
      outputParameters:
      - type: object
        mapping: $.
    - name: core-get-extract
      description: Get details of a specific Extract process
      hints:
        readOnly: true
        openWorld: true
      call: goldengate-rest.get-extract
      with:
        extract: tools.extract
      outputParameters:
      - type: object
        mapping: $.
    - name: core-create-extract
      description: Create a new Extract process
      hints:
        readOnly: false
      call: goldengate-rest.create-extract
      with:
        extract: tools.extract
        type: tools.type
        trail: tools.trail
      outputParameters:
      - type: object
        mapping: $.
    - name: core-issue-extract-command
      description: Issue a command (START, STOP, KILL) to an Extract
      hints:
        readOnly: false
      call: goldengate-rest.issue-extract-command
      with:
        extract: tools.extract
        action: tools.action
      outputParameters:
      - type: object
        mapping: $.
    - name: core-list-replicats
      description: List all Replicat processes
      hints:
        readOnly: true
        openWorld: true
      call: goldengate-rest.list-replicats
      outputParameters:
      - type: object
        mapping: $.
    - name: core-get-replicat
      description: Get details of a specific Replicat process
      hints:
        readOnly: true
        openWorld: true
      call: goldengate-rest.get-replicat
      with:
        replicat: tools.replicat
      outputParameters:
      - type: object
        mapping: $.
    - name: core-create-replicat
      description: Create a new Replicat process
      hints:
