    resources:
    - name: services-v2-connections
      path: /services/v2/connections
      operations:
      - name: listconnections
        method: GET
        description: Oracle Goldengate List Database Connections
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
