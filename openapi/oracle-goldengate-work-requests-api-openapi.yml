openapi: 3.2.0
info:
  title: Oracle GoldenGate Cloud Service Work Requests API
  description: Oracle Cloud Infrastructure (OCI) API for managing GoldenGate deployments, connections, deployment backups, database registrations, pipelines, connection assignments, certificates, and work requests in OCI. This is the OCI control-plane API (version 20200407) for provisioning and managing GoldenGate cloud resources. Based on the OCI GoldenGate API documentation and Python SDK reference.
  version: '20200407'
  contact:
    name: Oracle Support
    url: https://support.oracle.com
  license:
    name: Oracle Technology Network License
    url: https://www.oracle.com/legal/terms.html
  x-documentation:
  - url: https://docs.oracle.com/en-us/iaas/api/#/en/goldengate/20200407/
    description: OCI GoldenGate API Reference
  - url: https://docs.oracle.com/en-us/iaas/tools/python/latest/api/golden_gate.html
    description: OCI Python SDK - GoldenGate Client
servers:
- url: https://goldengate.{region}.oci.oraclecloud.com
  description: OCI GoldenGate regional endpoint
  variables:
    region:
      default: us-ashburn-1
      description: OCI region identifier
      enum:
      - us-ashburn-1
      - us-phoenix-1
      - eu-frankfurt-1
      - uk-london-1
      - ap-tokyo-1
      - ap-sydney-1
      - ca-toronto-1
      - ap-mumbai-1
      - sa-saopaulo-1
security:
- ociSignature: []
tags:
- name: Work Requests
  description: Track asynchronous operations
paths:
  /20200407/workRequests:
    get:
      operationId: listWorkRequests
      summary: Oracle Goldengate List Work Requests
      description: Returns a list of asynchronous work requests in the specified compartment.
      tags:
      - Work Requests
      parameters:
      - $ref: '#/components/parameters/compartmentIdParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/pageParam'
      responses:
        '200':
          description: Work requests listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRequestCollection'
              examples:
                Listworkrequests200Example:
                  summary: Default listWorkRequests 200 response
                  x-microcks-default: true
                  value:
                    items:
                    - id: abc123
                      operationType: example_value
                      status: example_value
                      percentComplete: 42.5
                      timeAccepted: '2026-01-15T10:30:00Z'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /20200407/workRequests/{workRequestId}:
    get:
      operationId: getWorkRequest
      summary: Oracle Goldengate Get a Work Request
      description: Returns the details of a specific asynchronous work request.
      tags:
      - Work Requests
      parameters:
      - name: workRequestId
        in: path
        required: true
        schema:
          type: string
        example: '500123'
      responses:
        '200':
          description: Work request retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRequest'
              examples:
                Getworkrequest200Example:
                  summary: Default getWorkRequest 200 response
                  x-microcks-default: true
                  value:
                    id: abc123
                    operationType: example_value
                    status: ACCEPTED
                    percentComplete: 42.5
                    timeAccepted: '2026-01-15T10:30:00Z'
                    timeStarted: '2026-01-15T10:30:00Z'
                    timeFinished: '2026-01-15T10:30:00Z'
                    resources:
                    - entityType: example_value
                      actionType: example_value
                      identifier: example_value
                      entityUri: example_value
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /20200407/workRequests/{workRequestId}/logs:
    get:
      operationId: listWorkRequestLogs
      summary: Oracle Goldengate List Work Request Logs
      description: Returns log entries for a work request.
      tags:
      - Work Requests
      parameters:
      - name: workRequestId
        in: path
        required: true
        schema:
          type: string
        example: '500123'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/pageParam'
      responses:
        '200':
          description: Logs listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRequestLogEntryCollection'
              examples:
                Listworkrequestlogs200Example:
                  summary: Default listWorkRequestLogs 200 response
                  x-microcks-default: true
                  value:
                    items:
                    - message: example_value
                      timestamp: '2026-01-15T10:30:00Z'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /20200407/workRequests/{workRequestId}/errors:
    get:
      operationId: listWorkRequestErrors
      summary: Oracle Goldengate List Work Request Errors
      description: Returns error entries for a work request.
      tags:
      - Work Requests
      parameters:
      - name: workRequestId
        in: path
        required: true
        schema:
          type: string
        example: '500123'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/pageParam'
      responses:
        '200':
          description: Errors listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRequestErrorCollection'
              examples:
                Listworkrequesterrors200Example:
                  summary: Default listWorkRequestErrors 200 response
                  x-microcks-default: true
                  value:
                    items:
                    - code: example_value
                      message: example_value
                      timestamp: '2026-01-15T10:30:00Z'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          example: example_value
        message:
          type: string
          example: example_value
    WorkRequestLogEntryCollection:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
              timestamp:
                type: string
                format: date-time
          example: []
    WorkRequestErrorCollection:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              timestamp:
                type: string
                format: date-time
          example: []
    WorkRequest:
      type: object
      properties:
        id:
          type: string
          example: abc123
        operationType:
          type: string
          example: example_value
        status:
          type: string
          enum:
          - ACCEPTED
          - IN_PROGRESS
          - FAILED
          - SUCCEEDED
          - CANCELING
          - CANCELED
          example: ACCEPTED
        percentComplete:
          type: number
          example: 42.5
        timeAccepted:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00Z'
        timeStarted:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00Z'
        timeFinished:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00Z'
        resources:
          type: array
          items:
            type: object
            properties:
              entityType:
                type: string
              actionType:
                type: string
              identifier:
                type: string
              entityUri:
                type: string
          example: []
    WorkRequestCollection:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkRequestSummary'
          example: []
    WorkRequestSummary:
      type: object
      properties:
        id:
          type: string
          example: abc123
        operationType:
          type: string
          example: example_value
        status:
          type: string
          example: example_value
        percentComplete:
          type: number
          example: 42.5
        timeAccepted:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00Z'
  parameters:
    compartmentIdParam:
      name: compartmentId
      in: query
      required: true
      description: The OCID of the compartment
      schema:
        type: string
    limitParam:
      name: limit
      in: query
      description: Maximum number of items to return
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 10
    pageParam:
      name: page
      in: query
      description: Pagination token
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    ociSignature:
      type: http
      scheme: bearer
      description: OCI API request signature (RFC 7616) or bearer token authentication
