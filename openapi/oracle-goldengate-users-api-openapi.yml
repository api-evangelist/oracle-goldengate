openapi: 3.2.0
info:
  title: Oracle Goldengate Users API
  contact:
    name: Oracle Support
    url: https://support.oracle.com
  license:
    name: Oracle Technology Network License
    url: https://www.oracle.com/legal/terms.html
  x-refined-note:
  - x-documentation differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Users across 3 of this provider''s published API definitions: oracle-goldengate-rest-api-openapi.yml, oracle-goldengate-stream-analytics-rest-api-openapi.yml, oracle-goldengate-veridata-rest-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{goldengate-host}:{port}
  description: Oracle GoldenGate Microservices server
  variables:
    goldengate-host:
      default: localhost
      description: GoldenGate Microservices host
    port:
      default: '443'
      description: HTTPS port for the service
- url: https://{ggsa-host}:{port}/osa
  description: Oracle GoldenGate Stream Analytics server
  variables:
    ggsa-host:
      default: localhost
      description: GGSA server host
    port:
      default: '9080'
      description: GGSA HTTP/S port
- url: https://{veridata-host}:{port}/veridata/v1
  description: Oracle GoldenGate Veridata server
  variables:
    veridata-host:
      default: localhost
      description: Veridata server host
    port:
      default: '8830'
      description: Veridata HTTPS port
security:
- basicAuth: []
tags:
- name: Users
  description: User management and authorization
paths:
  /services/v2/authorizations:
    get:
      operationId: listUserRoles
      summary: Oracle Goldengate List User Roles
      description: Returns a list of available authorization roles.
      tags:
      - Users
      responses:
        '200':
          description: Roles listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
              examples:
                Listuserroles200Example:
                  summary: Default listUserRoles 200 response
                  x-microcks-default: true
                  value:
                    roles:
                    - example_value
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    servers:
    - url: https://{goldengate-host}:{port}
      description: Oracle GoldenGate Microservices server
      variables:
        goldengate-host:
          default: localhost
          description: GoldenGate Microservices host
        port:
          default: '443'
          description: HTTPS port for the service
  /services/v2/authorizations/{role}:
