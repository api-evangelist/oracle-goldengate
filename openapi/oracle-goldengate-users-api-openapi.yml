      operationId: bulkCreateUsers
      summary: Oracle Goldengate Bulk Create Users for a Role
      description: Creates multiple users with the specified role in a single operation.
      tags:
      - Users
      parameters:
      - $ref: '#/components/parameters/roleParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCreateUsersRequest'
            examples:
              BulkcreateusersRequestExample:
                summary: Default bulkCreateUsers request
                x-microcks-default: true
                value:
                  users:
                  - name: Example Title
                    password: example_value
      responses:
        '201':
          description: Users created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
              examples:
                Bulkcreateusers201Example:
                  summary: Default bulkCreateUsers 201 response
