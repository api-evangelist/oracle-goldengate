components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  parameters:
    extractParam:
      name: extract
      in: path
      required: true
      description: Extract process name
      schema:
        type: string
    replicatParam:
      name: replicat
      in: path
      required: true
      description: Replicat process name
      schema:
        type: string
    domainParam:
      name: domain
      in: path
      required: true
      description: Credential store domain
      schema:
        type: string
    aliasParam:
      name: alias
      in: path
      required: true
      description: Credential alias name
      schema:
        type: string
    distpathParam:
      name: distpath
      in: path
      required: true
      description: Distribution path name
      schema:
        type: string
    mpointItemParam:
      name: item
      in: path
      required: true
      description: Process name for metrics
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 10
        message:
          type: string
          example: example_value
        severity:
          type: string
          example: example_value
    ServiceHealth:
      type: object
      properties:
        healthy:
          type: boolean
          example: true
        services:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
              port:
                type: integer
          example: []
    ExtractList:
      type: object
      properties:
        extracts:
          type: array
          items:
            $ref: '#/components/schemas/ExtractSummary'
          example: []
    ExtractSummary:
      type: object
      properties:
        name:
          type: string
          example: Example Title
        type:
          type: string
          example: example_value
        status:
          type: string
          example: example_value
    Extract:
      type: object
      properties:
        name:
          type: string
          example: Example Title
        type:
          type: string
          enum:
          - cdc
          - initialload
          - datapump
          example: cdc
        status:
          type: string
          enum:
          - running
          - stopped
          - abended
          example: running
        trail:
          type: string
          example: example_value
        config:
          type: array
          items:
            type: string
          example: []
    CreateExtractRequest:
      type: object
      required:
      - type
      - trail
      - config
      properties:
        type:
          type: string
          enum:
          - cdc
          - initialload
          - datapump
          example: cdc
        trail:
          type: string
          example: example_value
        begin:
          type: string
          example: example_value
        config:
          type: array
          items:
            type: string
          example: []
    UpdateExtractRequest:
      type: object
      properties:
        config:
          type: array
          items:
            type: string
          example: []
        status:
          type: string
          example: example_value
    ReplicatList:
      type: object
      properties:
        replicats:
          type: array
          items:
            $ref: '#/components/schemas/ReplicatSummary'
          example: []
    ReplicatSummary:
      type: object
      properties:
        name:
          type: string
          example: Example Title
        type:
          type: string
          example: example_value
        status:
          type: string
          example: example_value
        handler:
          type: string
          description: Big data handler type (e.g., kafka, hdfs, mongodb)
          example: example_value
    Replicat:
      type: object
      properties:
        name:
          type: string
          description: Replicat process name
          example: Example Title
        type:
          type: string
          enum:
          - classic
          - coordinated
          - integrated
          - parallel
          example: classic
        status:
          type: string
          enum:
          - running
          - stopped
          - abended
          example: running
        trail:
          type: string
          description: Source trail file
          example: example_value
        handler:
          type: string
          description: Big data handler type
          enum:
          - kafka
          - kafkaconnect
          - hdfs
          - hbase
          - cassandra
          - mongodb
          - elasticsearch
          - jdbc
          - kinesis
          - bigquery
          - pubsub
          - objectstorage
          example: kafka
        config:
          type: array
          items:
            type: string
          description: Parameter file content including handler configuration
          example: []
        handlerProperties:
          type: string
          description: Path to handler properties file
          example: example_value
    CreateReplicatRequest:
      type: object
      required:
      - type
      - trail
      - config
      properties:
        type:
          type: string
          enum:
          - classic
          - coordinated
          - integrated
          - parallel
          example: classic
        trail:
          type: string
          example: example_value
        begin:
          type: string
          example: example_value
        config:
          type: array
          items:
            type: string
          example: []
        checkpointTable:
          type: string
          example: example_value
    UpdateReplicatRequest:
      type: object
      properties:
        config:
          type: array
          items:
            type: string
          example: []
        status:
          type: string
          example: example_value
    ProcessCommand:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - start
          - stop
          - kill
          - forcestop
          - status
          - stats
          example: start
    CommandResponse:
      type: object
      properties:
        response:
          type: object
          properties:
            code:
              type: string
            severity:
              type: string
            message:
              type: string
          example: example_value
    ProcessStatus:
      type: object
      properties:
        name:
          type: string
          example: Example Title
        status:
          type: string
          example: example_value
        lag:
          type: string
          example: example_value
        since:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00Z'
    DataTargetTypeList:
      type: object
      properties:
        types:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Handler type name
              description:
                type: string
          example: []
    DataTargetTypeSchema:
      type: object
      description: JSON Schema describing the handler configuration properties
      properties:
        type:
          type: string
          example: example_value
        properties:
          type: object
          additionalProperties: true
          example: example_value
    CredentialDomainList:
      type: object
      properties:
        domains:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              aliasCount:
                type: integer
          example: []
    CredentialAlias:
