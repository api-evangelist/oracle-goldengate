          example: []
    ConfigFile:
      type: object
      properties:
        name:
          type: string
          example: Example Title
        content:
          type: string
          example: example_value
    ConfigFileContent:
      type: object
      required:
      - content
      properties:
        content:
          type: string
          example: example_value
    TrailList:
      type: object
      properties:
        trails:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              path:
                type: string
              sequence:
                type: integer
          example: []
    DistributionPathList:
      type: object
      properties:
        paths:
          type: array
          items:
            $ref: '#/components/schemas/DistributionPathSummary'
          example: []
    DistributionPathSummary:
      type: object
      properties:
        name:
          type: string
          example: Example Title
        status:
          type: string
          example: example_value
        source:
          type: string
          example: example_value
        target:
          type: string
          example: example_value
    DistributionPath:
      type: object
      properties:
        name:
          type: string
          example: Example Title
        status:
          type: string
          example: example_value
        source:
          type: string
          example: example_value
        target:
          type: string
          example: example_value
    CreateDistributionPathRequest:
      type: object
      required:
      - source
      - target
      properties:
        source:
          type: string
          example: example_value
        target:
          type: string
          example: example_value
    ExecuteCommandRequest:
      type: object
      required:
      - command
      properties:
        command:
          type: string
          example: example_value
    ProcessMetricsList:
      type: object
      properties:
        processes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
              status:
                type: string
              lag:
                type: number
              operationsProcessed:
                type: integer
                format: int64
          example: []
    ReplicatStatistics:
      type: object
      properties:
        processName:
          type: string
          example: example_value
        totalOperations:
          type: integer
          format: int64
          example: 10
        inserts:
          type: integer
          format: int64
          example: 10
        updates:
          type: integer
          format: int64
          example: 10
        deletes:
          type: integer
          format: int64
          example: 10
        handlerStatistics:
          type: object
          properties:
            recordsWritten:
              type: integer
              format: int64
            bytesWritten:
              type: integer
              format: int64
            batchesProcessed:
              type: integer
              format: int64
          example: example_value
