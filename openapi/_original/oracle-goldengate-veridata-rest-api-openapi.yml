components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication with Veridata credentials
  parameters:
    connectionIdParam:
      name: Id
      in: path
      required: true
      description: Connection identifier
      schema:
        type: integer
        format: int64
    groupIdParam:
      name: Id
      in: path
      required: true
      description: Compare group identifier
      schema:
        type: integer
        format: int64
    groupIdPathParam:
      name: groupId
      in: path
      required: true
      description: Compare group identifier
      schema:
        type: integer
        format: int64
    comparePairIdParam:
      name: Id
      in: path
      required: true
      description: Compare pair identifier
      schema:
        type: integer
        format: int64
    jobIdParam:
      name: Id
      in: path
      required: true
      description: Job identifier
      schema:
        type: integer
        format: int64
    profileIdParam:
      name: Id
      in: path
      required: true
      description: Profile identifier
      schema:
        type: integer
        format: int64
    runIdParam:
      name: runId
      in: path
      required: true
      description: Job or repair run identifier
      schema:
        type: integer
        format: int64
    userIdParam:
      name: Id
      in: path
      required: true
      description: User identifier
      schema:
        type: integer
        format: int64
    userGroupIdParam:
      name: Id
      in: path
      required: true
      description: User group identifier
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 10
        message:
          type: string
          example: example_value
