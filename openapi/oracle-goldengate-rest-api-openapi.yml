components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication with GoldenGate user credentials
  parameters:
    deploymentParam:
      name: deployment
      in: path
      required: true
      description: Name of the GoldenGate deployment
      schema:
        type: string
    serviceParam:
      name: service
      in: path
      required: true
      description: Name of the service within a deployment
      schema:
        type: string
    extractParam:
      name: extract
      in: path
      required: true
      description: Name of the Extract process
      schema:
        type: string
    replicatParam:
      name: replicat
      in: path
      required: true
      description: Name of the Replicat process
      schema:
        type: string
    domainParam:
      name: domain
      in: path
      required: true
      description: Credential store domain name
      schema:
        type: string
    aliasParam:
      name: alias
      in: path
      required: true
      description: Credential alias name
      schema:
        type: string
    connectionParam:
      name: connection
      in: path
      required: true
      description: Name of the database connection
      schema:
        type: string
    distpathParam:
      name: distpath
      in: path
      required: true
      description: Name of the distribution path
      schema:
        type: string
    pathParam:
      name: path
      in: path
      required: true
      description: Name of the collector/receiver path
      schema:
        type: string
    taskParam:
      name: task
      in: path
      required: true
      description: Name of the automated task
      schema:
        type: string
    roleParam:
      name: role
      in: path
      required: true
      description: Authorization role name
      schema:
        type: string
        enum:
        - Security
        - Administrator
        - Operator
        - User
    userParam:
      name: user
      in: path
      required: true
      description: Username
      schema:
        type: string
    reportParam:
      name: report
      in: path
      required: true
      description: Report identifier
      schema:
        type: string
    mpointItemParam:
      name: item
      in: path
      required: true
      description: Process name or identifier for metrics
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request - invalid parameters or request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          description: HTTP status code
          example: 10
        message:
          type: string
          description: Error message
          example: example_value
        severity:
          type: string
          description: Error severity level
          example: example_value
    ApiVersionList:
      type: object
      properties:
        versions:
          type: array
          items:
            type: object
            properties:
              version:
                type: string
              isLatest:
                type: boolean
              links:
                type: array
                items:
                  $ref: '#/components/schemas/Link'
          example: []
    ApiVersionDetails:
      type: object
      properties:
        version:
          type: string
          example: example_value
        isLatest:
          type: boolean
          example: true
        lifecycle:
          type: string
          example: example_value
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          example: []
    Link:
      type: object
      properties:
        rel:
          type: string
          example: example_value
        href:
          type: string
          example: example_value
        mediaType:
          type: string
          example: example_value
    ConfigSummary:
      type: object
      properties:
        serviceType:
          type: string
          example: example_value
        status:
          type: string
          example: example_value
        host:
          type: string
          example: example_value
        port:
          type: integer
          example: 10
        deploymentName:
          type: string
          example: example_value
    ServiceHealthDetails:
      type: object
      properties:
        healthy:
          type: boolean
          example: true
        services:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
              port:
                type: integer
              secure:
                type: boolean
          example: []
    HealthCheckSummary:
      type: object
      properties:
        healthy:
          type: boolean
          example: true
