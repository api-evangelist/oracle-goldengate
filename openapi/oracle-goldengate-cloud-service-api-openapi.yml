components:
  securitySchemes:
    ociSignature:
      type: http
      scheme: bearer
      description: OCI API request signature (RFC 7616) or bearer token authentication
  parameters:
    compartmentIdParam:
      name: compartmentId
      in: query
      required: true
      description: The OCID of the compartment
      schema:
        type: string
    deploymentIdParam:
      name: deploymentId
      in: path
      required: true
      description: The OCID of the deployment
      schema:
        type: string
    deploymentBackupIdParam:
      name: deploymentBackupId
      in: path
      required: true
      description: The OCID of the deployment backup
      schema:
        type: string
    connectionIdParam:
      name: connectionId
      in: path
      required: true
      description: The OCID of the connection
      schema:
        type: string
    pipelineIdParam:
      name: pipelineId
      in: path
      required: true
      description: The OCID of the pipeline
      schema:
        type: string
    ifMatchParam:
      name: if-match
      in: header
      description: ETag for optimistic concurrency control
      schema:
        type: string
    opcRetryTokenParam:
      name: opc-retry-token
      in: header
      description: Idempotent retry token
      schema:
        type: string
    opcRequestIdParam:
      name: opc-request-id
      in: header
      description: Unique request identifier
      schema:
        type: string
    limitParam:
      name: limit
      in: query
      description: Maximum number of items to return
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 10
    pageParam:
      name: page
      in: query
      description: Pagination token
      schema:
        type: string
    sortByParam:
      name: sortBy
      in: query
      schema:
        type: string
        enum:
        - timeCreated
        - displayName
    sortOrderParam:
      name: sortOrder
      in: query
      schema:
        type: string
        enum:
        - ASC
        - DESC
    lifecycleStateParam:
      name: lifecycleState
      in: query
      schema:
        type: string
        enum:
        - CREATING
        - UPDATING
        - ACTIVE
        - INACTIVE
        - DELETING
        - DELETED
        - FAILED
        - NEEDS_ATTENTION
        - IN_PROGRESS
        - CANCELING
        - CANCELED
        - SUCCEEDED
    displayNameParam:
      name: displayName
      in: query
      description: Filter by display name
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          example: example_value
        message:
          type: string
          example: example_value
    DeploymentCollection:
      type: object
      properties:
