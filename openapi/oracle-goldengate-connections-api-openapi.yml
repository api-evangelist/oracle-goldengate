        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    UpdateConnectionDetails:
      type: object
      properties:
        displayName:
          type: string
          example: example_value
        description:
          type: string
          example: A sample description.
        freeformTags:
          type: object
          additionalProperties:
            type: string
          example: example_value
    MetadataRequest:
      type: object
      properties:
        schemaPattern:
          type: string
          example: example_value
        tablePattern:
          type: string
          example: example_value
    Error:
      type: object
      properties:
        code:
          type: string
          example: example_value
        message:
          type: string
          example: example_value
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          description: HTTP status code
          example: 10
        message:
          type: string
          description: Error message
          example: example_value
        severity:
          type: string
          description: Error severity level
          example: example_value
    ConnectionStatus:
      type: object
      properties:
        connectionId:
          type: integer
          format: int64
          example: '500123'
        status:
          type: string
          enum:
          - connected
          - disconnected
          - error
          example: connected
        message:
          type: string
          example: example_value
    ConnectionList_2:
      type: object
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/Connection_2'
          example: []
    CreateConnectionRequest_2:
      type: object
      required:
      - name
      - databaseType
      - host
      - port
      properties:
        name:
          type: string
          example: Example Title
        description:
          type: string
          example: A sample description.
        databaseType:
          type: string
          example: example_value
        host:
          type: string
          example: example_value
        port:
          type: integer
          example: 10
        serviceName:
          type: string
          example: example_value
